variables:
  retire_json_keys_project: { value: true }
  management_project_id: { value: a-novel-management-prod }
  workload_project_id: { value: a-novel-production-prod }
  organization_id: { value: "1031663934757" }
  folder_id: { value: null }
  recovery_mode: { value: false }
  service_projects: { value: { json-keys: a-novel-json-keys-prod } }
  pgbackrest_repository_services: { value: [] }
  service_recovery_projects: { value: {} }
resources:
  - type: google_project
    address: module.service_project["json-keys"].module.project.google_project.service
    policy: DELETE
    before:
      id: projects/a-novel-json-keys-prod
      project_id: a-novel-json-keys-prod
      deletion_policy: PREVENT
  - type: google_logging_project_bucket_config
    address: module.service_project["json-keys"].module.project.google_logging_project_bucket_config.default
    policy: ABANDON
    before:
      id: projects/a-novel-json-keys-prod/locations/global/buckets/_Default
      project: a-novel-json-keys-prod
      retention_days: 30
      deletion_policy: PREVENT
  - type: google_service_account
    address: module.service_project["json-keys"].google_service_account.release
    policy: DELETE
    before:
      id: projects/a-novel-json-keys-prod/serviceAccounts/infra-release@a-novel-json-keys-prod.iam.gserviceaccount.com
      project: a-novel-json-keys-prod
      disabled: false
      deletion_policy: PREVENT
  - type: google_iam_workload_identity_pool_provider
    address: module.service_project["json-keys"].google_iam_workload_identity_pool_provider.release
    policy: DELETE
    before:
      id: projects/a-novel-management-prod/locations/global/workloadIdentityPools/github-actions/providers/r-a-novel-json-keys-prod
      project: a-novel-management-prod
      disabled: false
      deletion_policy: PREVENT
  - type: google_storage_managed_folder
    address: module.service_project["json-keys"].google_storage_managed_folder.release["state"]
    policy: ABANDON
    before:
      id: a-novel-management-prod-232403541574-tofu-state/services/a-novel-json-keys-prod/release/
      bucket: a-novel-management-prod-232403541574-tofu-state
      force_destroy: false
      deletion_policy: PREVENT
  - type: google_storage_managed_folder
    address: module.service_project["json-keys"].google_storage_managed_folder.release["receipts"]
    policy: ABANDON
    before:
      id: a-novel-management-prod-232403541574-deployment-receipts/services/a-novel-json-keys-prod/production/
      bucket: a-novel-management-prod-232403541574-deployment-receipts
      force_destroy: false
      deletion_policy: PREVENT
