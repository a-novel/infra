# GenAI's own numbers. CloudNativePG runs each query on the primary at every scrape, and exports
# each column as cnpg_<query>_<column>. generations holds the live rows and six hours of settled
# ones before the purge deletes them, so reading it whole stays cheap. No query exports an owner,
# and none reads a payload or a response. genai.sql grants every column the queries read.

# The live work, and how long its oldest rows have waited. The sweep stops a call still running
# after two hours and settles it within ten minutes, so a running call much older than that means
# the sweep stopped.
generations_live:
  query: |
    SELECT
      count(*) FILTER (WHERE status = 'pending') AS pending,
      count(*) FILTER (WHERE status = 'running') AS running,
      coalesce(extract(epoch FROM now() - min(created_at) FILTER (WHERE status = 'pending')), 0) AS oldest_pending_seconds,
      coalesce(extract(epoch FROM now() - min(start_requested_at) FILTER (WHERE status = 'running')), 0) AS oldest_running_seconds
    FROM generations
    WHERE status IN ('pending', 'running')
  primary: true
  target_databases: ["app"]
  metrics:
    - pending:
        usage: GAUGE
        description: Generations waiting for a provider call.
    - running:
        usage: GAUGE
        description: Generations a provider is working on.
    - oldest_pending_seconds:
        usage: GAUGE
        description: Age of the oldest waiting generation.
    - oldest_running_seconds:
        usage: GAUGE
        description: Time since the oldest running call started.

# The last hour's settled generations, by status and failure reason, which are fixed strings. The
# rollup adds an `all` row, which an hour without one still returns, so it reads as 0 rather than as
# no data. A generation that did not fail has a NULL error too, so GROUPING names the `all` row.
generations_settled:
  query: |
    SELECT
      coalesce(status::text, 'all') AS status,
      CASE WHEN GROUPING(error) = 1 THEN 'all' ELSE coalesce(error, 'none') END AS reason,
      count(*) AS total,
      coalesce(percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM settled_at - created_at)), 0) AS p95_seconds
    FROM generations
    WHERE settled_at > now() - interval '1 hour'
    GROUP BY ROLLUP ((status, error))
  primary: true
  target_databases: ["app"]
  metrics:
    - status:
        usage: LABEL
        description: The status the generation settled in, or all of them.
    - reason:
        usage: LABEL
        description: Why it failed, none, or all of them.
    - total:
        usage: GAUGE
        description: Generations settled in the last hour.
    - p95_seconds:
        usage: GAUGE
        description: Time from submission to settlement, at the 95th percentile.

# generation_usage is never purged and has no index on time alone. Its keys start with the
# generation's uuidv7, minted at submission, and a call reports its usage within about two and a
# half hours, so the key bound reads only the last 27 hours. The bound is the lowest uuidv7 of that
# instant, built from now(), so the planner knows it and reads that range of the primary key. A
# bound computed in a subquery is unknown at planning, and the plan scans the whole table. The rollup
# adds an `all` row, which a day without a call still returns, so it reads as 0 rather than as no
# data. A call without a tier has a NULL tier too, so GROUPING names the `all` row.
generation_tokens:
  query: |
    SELECT
      coalesce(model, 'all') AS model,
      coalesce(class, 'all') AS class,
      CASE WHEN GROUPING(tier) = 1 THEN 'all' ELSE coalesce(tier, 'none') END AS tier,
      coalesce(sum(input_tokens), 0) AS input,
      coalesce(sum(cached_input_tokens), 0) AS cached_input,
      coalesce(sum(output_tokens), 0) AS output,
      coalesce(sum(reasoning_tokens), 0) AS reasoning
    FROM generation_usage
    WHERE generation_id >= (lpad(to_hex((extract(epoch FROM now() - interval '27 hours') * 1000)::bigint), 12, '0') || '70008000000000000000')::uuid
      AND created_at > now() - interval '24 hours'
    GROUP BY ROLLUP ((model, class, tier))
  primary: true
  target_databases: ["app"]
  metrics:
    - model:
        usage: LABEL
        description: The model that ran, or all of them.
    - class:
        usage: LABEL
        description: The reasoning effort that ran, or all of them.
    - tier:
        usage: LABEL
        description: The provider's service tier, which sets the price, none, or all of them.
    - input:
        usage: GAUGE
        description: Input tokens over the last 24 hours.
    - cached_input:
        usage: GAUGE
        description: Of those, tokens read from the provider's cache, at a lower price.
    - output:
        usage: GAUGE
        description: Output tokens over the last 24 hours.
    - reasoning:
        usage: GAUGE
        description: Of those, reasoning tokens.

generation_users:
  query: |
    SELECT count(DISTINCT owner_id) AS active
    FROM generation_usage
    WHERE generation_id >= (lpad(to_hex((extract(epoch FROM now() - interval '27 hours') * 1000)::bigint), 12, '0') || '70008000000000000000')::uuid
      AND created_at > now() - interval '24 hours'
  primary: true
  target_databases: ["app"]
  metrics:
    - active:
        usage: GAUGE
        description: Accounts that ran a generation in the last 24 hours.

# Settled content past its retention, which pg_cron purges every 10 seconds.
generations_expired:
  query: |
    SELECT count(*) AS waiting, coalesce(extract(epoch FROM now() - min(expires_at)), 0) AS oldest_seconds
    FROM generations
    WHERE expires_at < now()
  primary: true
  target_databases: ["app"]
  metrics:
    - waiting:
        usage: GAUGE
        description: Generations kept past their retention.
    - oldest_seconds:
        usage: GAUGE
        description: How long the oldest of them has been kept past it.
