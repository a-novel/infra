# Authentication's own numbers. CloudNativePG runs each query on the primary at every scrape, and
# exports each column as cnpg_<query>_<column>. No query reads an email, a code or a target.
# authentication.sql grants every column the queries read.

# The rollup adds an `all` row, which an empty table still returns, so no account reads as 0
# rather than as no data.
accounts:
  query: |
    SELECT coalesce(role, 'all') AS role, count(*) AS total, count(*) FILTER (WHERE created_at > now() - interval '7 days') AS created_7d
    FROM credentials
    GROUP BY ROLLUP (role)
  primary: true
  target_databases: ["app"]
  metrics:
    - role:
        usage: LABEL
        description: The accounts' role, or all of them.
    - total:
        usage: GAUGE
        description: Accounts with this role.
    - created_7d:
        usage: GAUGE
        description: Of those, accounts created in the last 7 days.

# What became of the codes mailed in the last 7 days, longer than any code lives: used, replaced by
# a newer one, still pending, or expired unused. The service marks a used or replaced code through
# deleted_comment, and leaves an expired one as it is.
short_codes:
  query: |
    SELECT
      usage,
      count(*) AS issued_7d,
      count(*) FILTER (WHERE deleted_comment = 'key consumed') AS used_7d,
      count(*) FILTER (WHERE deleted_comment = 'override with newer key') AS replaced_7d,
      count(*) FILTER (WHERE deleted_at IS NULL AND expires_at > now()) AS pending,
      count(*) FILTER (WHERE deleted_at IS NULL AND expires_at <= now()) AS expired_7d
    FROM short_codes
    WHERE created_at > now() - interval '7 days'
    GROUP BY usage
  primary: true
  target_databases: ["app"]
  metrics:
    - usage:
        usage: LABEL
        description: What the code authorizes.
    - issued_7d:
        usage: GAUGE
        description: Codes mailed in the last 7 days.
    - used_7d:
        usage: GAUGE
        description: Of those, codes used.
    - replaced_7d:
        usage: GAUGE
        description: Of those, codes replaced by a newer one before use.
    - pending:
        usage: GAUGE
        description: Codes neither used, replaced nor expired.
    - expired_7d:
        usage: GAUGE
        description: Of those mailed in the last 7 days, codes that expired unused.
