apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agora-json-keys-rest
  namespace: unconfigured # from-param: ${projectId}
  labels:
    component: json-keys
    role: rest
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
    # This additional public-key API has no continuously running instance.
    run.googleapis.com/minScale: "0"
    run.googleapis.com/maxScale: "3"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"unconfigured","subnetwork":"unconfigured","tags":["agora-json-keys"]}]' # from-param: [{"network":"${network}","subnetwork":"${subnetwork}","tags":["agora-json-keys"]}]
        run.googleapis.com/secrets: unconfigured # from-param: postgres-password:projects/${managementProjectNumber}/secrets/production-json-keys-postgres-password
    spec:
      serviceAccountName: unconfigured # from-param: ${runtimeServiceAccount}
      timeoutSeconds: 60
      containerConcurrency: 20
      containers:
        - name: rest
          image: service-json-keys
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /v2/ping
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 80
          livenessProbe:
            httpGet:
              path: /v2/ping
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          env:
            - name: GCLOUD_PROJECT_ID
              value: unconfigured # from-param: ${projectId}
            - name: OTEL
              value: "true"
            - name: REST_PORT
              value: "8080"
            - name: POSTGRES_HOST
              value: unconfigured # from-param: ${databasePrivateIP}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: agora_json_keys
            - name: POSTGRES_DATABASE
              value: agora_json_keys
            - name: POSTGRES_TLS_ENABLED
              value: "false"
            - name: POSTGRES_MAX_IDLE_CONNS
              value: "10"
            - name: POSTGRES_MAX_OPEN_CONNS
              value: "20"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-password
                  key: "0" # from-param: ${postgresPasswordVersion}
