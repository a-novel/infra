apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agora-authentication-rest
  namespace: unconfigured # from-param: ${projectId}
  labels:
    component: authentication
    role: rest
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
    run.googleapis.com/minScale: "1"
    run.googleapis.com/maxScale: "3"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        # Accepted email work continues after the HTTP response.
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"unconfigured","subnetwork":"unconfigured","tags":["agora-authentication"]}]' # from-param: [{"network":"${network}","subnetwork":"${subnetwork}","tags":["agora-authentication"]}]
        run.googleapis.com/secrets: unconfigured # from-param: postgres-password:projects/${managementProjectNumber}/secrets/production-authentication-postgres-password,smtp-password:projects/${managementProjectNumber}/secrets/production-authentication-smtp-sender-password
    spec:
      serviceAccountName: unconfigured # from-param: ${runtimeServiceAccount}
      timeoutSeconds: 60
      containerConcurrency: 20
      containers:
        - name: rest
          image: service-authentication
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /v2/ping
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 80
          livenessProbe:
            httpGet:
              path: /v2/ping
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          env:
            - name: GCLOUD_PROJECT_ID
              value: unconfigured # from-param: ${projectId}
            - name: REST_PORT
              value: "8080"
            - name: REST_TIMEOUT_SHUTDOWN
              value: 9s
            - name: PLATFORM_AUTH_URL
              value: "" # from-param: ${platformAuthURL}
            - name: POSTGRES_HOST
              value: unconfigured # from-param: ${databasePrivateIP}
            - name: POSTGRES_PORT
              value: "5433"
            - name: POSTGRES_USER
              value: agora_authentication
            - name: POSTGRES_DATABASE
              value: agora_authentication
            - name: POSTGRES_TLS_ENABLED
              value: "false"
            - name: POSTGRES_MAX_IDLE_CONNS
              value: "10"
            - name: POSTGRES_MAX_OPEN_CONNS
              value: "20"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-password
                  key: "0" # from-param: ${postgresPasswordVersion}
            - name: SERVICE_JSON_KEYS_HOST
              value: unconfigured # from-param: ${jsonKeysHost}
            - name: SERVICE_JSON_KEYS_PORT
              value: "443"
            - name: SMTP_ADDR
              value: unconfigured # from-param: ${smtpAddress}
            - name: SMTP_USERNAME
              value: unconfigured # from-param: ${smtpUsername}
            - name: SMTP_SENDER_DOMAIN
              value: unconfigured # from-param: ${smtpSenderDomain}
            - name: SMTP_SENDER_EMAIL
              value: unconfigured # from-param: ${smtpSenderEmail}
            - name: SMTP_SENDER_NAME
              value: unconfigured # from-param: ${smtpSenderName}
            - name: SMTP_MAX_CONCURRENT
              value: "8"
            - name: SMTP_TIMEOUT
              value: 5s
            - name: SMTP_SENDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-password
                  key: "0" # from-param: ${smtpPasswordVersion}
