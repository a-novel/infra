vulnerabilities:
  - id: CVE-2026-93687
    paths: [pnpm-lock.yaml]
    purls: [pkg:npm/braces@3.0.3]
    expired_at: 2026-10-10
    statement: >-
      Development-only Renovate dependency with no published fix. Deeply nested
      patterns can terminate tooling. This temporary exception accepts that
      tooling availability risk; it makes no claim of non-exploitability.
  - id: CVE-2026-93748
    paths: [pnpm-lock.yaml]
    purls: [pkg:npm/http-cache-semantics@4.2.0]
    expired_at: 2026-10-10
    statement: >-
      Development-only Renovate dependency with no published fix. Shared HTTP
      caches can disclose another user's cached response. Local validation and
      fixture lookups do not serve a multi-user cache, but complete dependency
      reachability has not been proven. This temporary exception accepts that
      residual tooling risk.
