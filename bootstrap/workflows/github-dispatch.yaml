# Dispatches one workflow in each repository its schedule lists, because GitHub starts scheduled
# workflows hours late. Cloud Scheduler starts an execution per workflow at its cron, with
# {"workflow": <file>}. The repository owner's token is read from Secret Manager at dispatch time,
# and calls are never logged. Only the scheduled workflows dispatch, and only to their listed
# repositories: any management-project caller may start an execution.
main:
  params: [args]
  steps:
    - read_config:
        assign:
          - versions: ${json.decode(sys.get_env("TOKEN_VERSIONS"))}
          - repositories: ${map.get(json.decode(sys.get_env("SCHEDULED")), args.workflow)}
    - refuse_unscheduled:
        switch:
          - condition: ${repositories == null}
            steps:
              - refuse:
                  raise: ${"Only the scheduled workflows dispatch, not " + args.workflow + "."}
    - dispatch_each:
        for:
          value: repository
          in: ${repositories}
          steps:
            - owner:
                assign:
                  - owner: ${text.split(repository, "/")[0]}
            # A failure must not cost another repository's dispatch.
            - dispatch:
                try:
                  steps:
                    - read_token:
                        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                        args:
                          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                          secret_id: ${"production-github-dispatch-" + owner}
                          version: ${string(versions[owner])}
                        result: token
                    - send:
                        call: http.post
                        args:
                          url: ${"https://api.github.com/repos/" + repository + "/actions/workflows/" + args.workflow + "/dispatches"}
                          headers:
                            Accept: application/vnd.github+json
                            Authorization: ${"Bearer " + token}
                            User-Agent: a-novel-github-dispatch
                            X-GitHub-Api-Version: "2022-11-28"
                          body:
                            ref: master
                retry: ${http.default_retry}
                except:
                  as: error
                  steps:
                    - report:
                        call: sys.log
                        args:
                          severity: WARNING
                          text: ${"Could not dispatch " + repository + " " + args.workflow + " (HTTP " + string(default(map.get(error, "code"), 0)) + ")."}
