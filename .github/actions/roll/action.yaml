name: Database rollout
description: >
  Move a service's database host and backup repository VM onto their applied configuration. The
  database host moves only when it differs and the service's planned downtime is in progress and
  its service has taken it, after a snapshot of its data disk; the repository VM moves when its config label differs from the
  running one, and after its database host, so pgBackRest keeps one version on both. With force,
  both move now. The caller must hold the foundation identity and set DOWNTIME.

inputs:
  service:
    required: true
    description: Service root whose hosts move, such as json-keys.
  force:
    required: false
    default: "false"
    description: '"true" to restart both hosts now, whatever their state and the downtime.'
  webhook:
    required: false
    default: ""
    description: Discord webhook of the deployments channel. Empty skips the posts.
  roles:
    required: false
    default: "{}"
    description: >
      JSON map from "<org>/<repo>" to Discord role ids. A failed database rollout pings
      a-novel/infra and the service's role.

runs:
  using: composite
  steps:
    - name: Check the hosts
      id: check
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        where=(--zone=europe-west1-d --project=a-novel-production-prod)
        group="agora-database-$SERVICE" repository="agora-pgbackrest-$SERVICE"
        # Observed state, not this deploy's changes: a cancelled or force-merged deploy loses nothing.
        database_pending="$(gcloud compute instance-groups managed describe "$group" "${where[@]}" --format=json |
          jq '(.status.versionTarget.isReached and (.status.allInstancesConfig.effective // true)) | not')"
        labels="$(gcloud compute instances describe "$repository" "${where[@]}" --format='json(labels)')"
        config="$(jq -r '.labels.config // ""' <<<"$labels")"
        repository_pending="$(jq '.labels.config != .labels["running-config"]' <<<"$labels")"
        started=false
        if [ -n "${DOWNTIME:-}" ] && jq -e --arg component "service-$SERVICE.database" '.components | index($component)' <<<"$DOWNTIME" >/dev/null \
          && [ "$(date -d "$(jq -r .start <<<"$DOWNTIME")" +%s)" -le "$(date +%s)" ]; then
          started=true
        fi
        if [ "$FORCE" = true ]; then database_pending=true repository_pending=true started=true; fi

        if [ "$database_pending" = true ]; then
          if [ "$started" != true ]; then
            echo "::warning::Rollout pending: the $SERVICE database host waits for a planned downtime listing service-$SERVICE.database."
            echo "- \`$SERVICE\`: database rollout pending until its planned downtime" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # DOWNTIME alone does not stop the services: only a deploy gives them DOWNTIME_START. Roll
          # only once the serving revision is the latest one and carries this downtime's start.
          if [ "$FORCE" != true ]; then
            case "$SERVICE" in
              json-keys) run=(agora-json-keys-grpc --project=a-novel-production-prod) ;;
              authentication) run=(agora-authentication-rest --project=a-novel-public-api-prod) ;;
              *) echo "::error::Unknown service $SERVICE."; exit 1 ;;
            esac
            stopped="$(gcloud run services describe "${run[@]}" --region=europe-west1 --format=json |
              jq --arg start "$(jq -r .start <<<"$DOWNTIME")" '.status.latestReadyRevisionName == .status.latestCreatedRevisionName
                and ([.spec.template.spec.containers[].env[]? | select(.name == "DOWNTIME_START") | .value] | index($start) != null)')"
            if [ "$stopped" != true ]; then
              echo "::error::The $SERVICE service has not taken the planned downtime yet; run a deploy by hand to apply it, which rolls the host."
              exit 1
            fi
          fi
        fi
        { echo "database=$database_pending"; echo "repository=$repository_pending"; echo "config=$config"; } >>"$GITHUB_OUTPUT"

    # Gold, not the informational blue: restarting a database host needs someone watching.
    - name: Announce the database rollout
      if: steps.check.outputs.database == 'true'
      uses: a-novel-kit/workflows/generic-actions/discord-post@v1.56.0
      with:
        webhook: ${{ inputs.webhook }}
        color: upcoming
        title: a-novel/infra · ${{ inputs.service }} database rollout started
        url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        description: Snapshot of `agora-data-${{ inputs.service }}`, then a restart of `agora-database-${{ inputs.service }}`.

    - name: Roll the hosts
      id: roll
      if: steps.check.outputs.database == 'true' || steps.check.outputs.repository == 'true'
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        DATABASE: ${{ steps.check.outputs.database }}
        CONFIG: ${{ steps.check.outputs.config }}
      run: |
        set -euo pipefail
        where=(--zone=europe-west1-d --project=a-novel-production-prod)
        group="agora-database-$SERVICE" repository="agora-pgbackrest-$SERVICE"
        if [ "$DATABASE" = true ]; then
          # The data and WAL share this disk, so PostgreSQL recovers the snapshot as after a power loss.
          snapshot="agora-data-$SERVICE-$(date -u +%Y%m%d-%H%M%S)"
          gcloud compute disks snapshot "agora-data-$SERVICE" --snapshot-names="$snapshot" \
            --storage-location=europe-west1 --labels="component=$SERVICE,role=pre-rollout" "${where[@]}"
          gcloud compute instance-groups managed update-instances "$group" --all-instances \
            --minimal-action=restart --most-disruptive-allowed-action=replace "${where[@]}"
          gcloud compute instance-groups managed wait-until "$group" --stable --timeout=900 "${where[@]}"
          # Snapshots outlive the next rollout, which may be the revert of a damaging one.
          gcloud compute snapshots list --project=a-novel-production-prod --format='value(name)' \
            --filter="labels.role=pre-rollout AND labels.component=$SERVICE AND creationTimestamp<-P14D" |
            xargs -r gcloud compute snapshots delete --quiet --project=a-novel-production-prod
          echo "- \`$SERVICE\`: database host rolled after snapshot \`$snapshot\`" >>"$GITHUB_STEP_SUMMARY"
        fi
        # The repository VM follows its database host, so pgBackRest keeps one version on both.
        gcloud compute instances stop "$repository" "${where[@]}"
        gcloud compute instances start "$repository" "${where[@]}"
        gcloud compute instances add-labels "$repository" --labels="running-config=$CONFIG" "${where[@]}"
        echo "- \`$SERVICE\`: backup repository VM restarted" >>"$GITHUB_STEP_SUMMARY"

    - name: Report the database rollout
      if: always() && steps.check.outputs.database == 'true'
      uses: a-novel-kit/workflows/generic-actions/discord-post@v1.56.0
      with:
        webhook: ${{ inputs.webhook }}
        color: ${{ steps.roll.outcome == 'success' && 'succeeded' || 'failed' }}
        title: >-
          a-novel/infra · ${{ inputs.service }} database rollout
          ${{ steps.roll.outcome == 'success' && 'succeeded' || 'failed' }}
        url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        mention_roles: >-
          ${{ steps.roll.outcome != 'success' && format('{0} {1}',
          fromJSON(inputs.roles || '{}')['a-novel/infra'] || '',
          fromJSON(inputs.roles || '{}')[format('a-novel/service-{0}', inputs.service)] || '') || '' }}
