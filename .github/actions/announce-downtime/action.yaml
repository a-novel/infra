name: Announce a planned downtime
description: >
  Posts one step of a planned downtime to the public a-novel-planned-downtime channel. Times are
  Discord timestamps, so each reader sees their own time zone and how far away the time is.

inputs:
  webhook:
    required: true
    description: Discord webhook of the planned downtime channel. Empty skips the post.
  window:
    required: true
    description: The downtime as DOWNTIME holds it, {components, start, end}.
  title:
    required: true
    description: What happened, such as "⏰ Planned downtime in 1 day".
  color:
    required: true
    description: The discord-post color naming the downtime's state.
  cleared:
    required: false
    default: "false"
    description: '"true" once the downtime ended or was cancelled, which drops the countdown headline.'

runs:
  using: composite
  steps:
    # Large type carries what readers need first: the countdown to the start, or to the expected end
    # once it started. Discord keeps relative timestamps live, so an old post never shows stale text.
    - name: Describe the downtime
      id: describe
      shell: bash
      env:
        WINDOW: ${{ inputs.window }}
        CLEARED: ${{ inputs.cleared }}
      run: |
        set -euo pipefail
        start="$(date -d "$(jq -r .start <<<"$WINDOW")" +%s)"
        end="$(date -d "$(jq -r .end <<<"$WINDOW")" +%s)"
        minutes=$(((end - start) / 60))
        length=""
        if ((minutes >= 60)); then length="$((minutes / 60)) h"; fi
        if ((minutes % 60)); then length="${length:+$length }$((minutes % 60)) min"; fi

        headline=""
        if [ "$CLEARED" != true ]; then
          headline="## Starts <t:$start:R>"
          if [ "$(date +%s)" -ge "$start" ]; then headline="## Expected back <t:$end:R>"; fi
        fi
        delimiter="EOF_$(openssl rand -hex 8)"
        {
          echo "description<<$delimiter"
          if [ -n "$headline" ]; then printf '%s\n\n' "$headline"; fi
          echo "**Affects**"
          # service-json-keys.database reads as "json-keys database".
          jq -r '.components[] | (capture("^service-(?<name>.+)\\.(?<part>[^.]+)$") // {name: ., part: ""})
            | "- **\(.name)** \(.part)"' <<<"$WINDOW"
          echo
          echo "**When**"
          echo "- **From** <t:$start:F>"
          echo "- **Back by** <t:$end:F> *(expected)*"
          echo "-# About ${length:-0 min} · shown in your time zone"
          echo "$delimiter"
        } >>"$GITHUB_OUTPUT"

    - uses: a-novel-kit/workflows/generic-actions/discord-post@v1.48.0
      with:
        webhook: ${{ inputs.webhook }}
        title: ${{ inputs.title }}
        color: ${{ inputs.color }}
        description: ${{ steps.describe.outputs.description }}
