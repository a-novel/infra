name: OpenTofu root
description: >
  Plan one root, enforce the deletion and downtime policies, and verify the release images the plan
  changes. With apply set, also copy the root's release images, then apply the reviewed plan.
  Pull-request and drift callers pass the read-only identity; the deploy workflow passes the writer.
  The caller's environment provides DOWNTIME and RELEASE_BOT_LOGIN.

inputs:
  root:
    required: true
    description: Root directory, such as environments/production/foundation.
  apply:
    required: false
    default: "false"
    description: When "true", copy the plan's images to Artifact Registry and apply the plan.
  allow_deletion:
    required: false
    default: "false"
    description: '"true" when the change carries the allow-resource-deletion label.'
  writer:
    required: false
    default: ""
    description: >-
      "true" reads the root's writer token or key without applying, as the GitHub root's drift check
      does with its own identity. Empty follows apply.
  refresh:
    required: false
    default: "true"
    description: >-
      "false" plans against the last applied state without reading the live objects. The GitHub
      root's pull requests pass it: GitHub hides fields from its read-only App that the deploy reads.
  allow_downtime:
    required: false
    default: "false"
    description: '"true" when the change carries the allow-downtime label. Only pull-request plans enforce it.'
  workload_identity_provider:
    required: true
    description: Workload Identity Federation provider of the selected identity.
  service_account:
    required: true
    description: Service account the workflow impersonates.
  github_token:
    required: true
    description: Token used to verify the release images' GitHub attestations.

outputs:
  changes:
    description: '"true" when the plan has changes.'
    value: ${{ steps.plan.outputs.changes }}
  plan:
    description: Path of the plan as JSON, as `tofu show -json` prints it.
    value: ${{ steps.plan.outputs.plan }}

runs:
  using: composite
  steps:
    # A re-run reuses its run's commit, so once master has moved on it would apply older code.
    - name: Refuse to re-run a superseded apply
      if: inputs.apply == 'true' && github.run_attempt != '1'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        # Read apart from the test, so a failed read stops here instead of reading as a move.
        head="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
        if [ "$head" != "$GITHUB_SHA" ]; then
          echo "::error::master has moved past this run's commit; run a deploy by hand instead of re-running this one."
          exit 1
        fi

    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version_file: .opentofu-version
        tofu_wrapper: false

    # Google's token service answers 503 now and then, and this action has no retry of its own: a
    # failed first attempt gets a second one, which fails the job if it fails too.
    - id: auth
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: access_token

    - if: steps.auth.outcome == 'failure'
      shell: bash
      run: sleep 15

    - id: auth_retry
      if: steps.auth.outcome == 'failure'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: access_token

    - name: Plan
      id: plan
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        # Only the writer may hold the state lock.
        LOCK: ${{ inputs.apply }}
        # Service roots pass the planned downtime window to their workloads.
        TF_VAR_downtime: ${{ env.DOWNTIME }}
        # The Grafana and GitHub roots read the credentials that write only when they apply. The plan
        # file keeps the value for the apply step.
        TF_VAR_writer: ${{ inputs.writer || inputs.apply }}
        REFRESH: ${{ inputs.refresh }}
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token || steps.auth_retry.outputs.access_token }}
      run: |
        set -euo pipefail
        errors="$RUNNER_TEMP/plan.err"
        # attempt leaves the plan's detailed exit code in status: 0 without changes, 2 with some.
        attempt() {
          tofu -chdir="$ROOT" init -input=false -lockfile=readonly -no-color >/dev/null 2>"$errors" || return 1
          status=0
          tofu -chdir="$ROOT" plan -input=false -no-color -lock="$LOCK" -refresh="$REFRESH" -detailed-exitcode -out=tfplan \
            >"$RUNNER_TEMP/plan.txt" 2>>"$errors" || status=$?
          [ "$status" -ne 1 ]
        }
        # transient tells whether a failed attempt is worth repeating. Cloud Storage answers 503 now
        # and then while OpenTofu reads the state, and a lost answer to the lock's write leaves this
        # runner's own lock (own-lock.mjs), which transient releases.
        transient() {
          local id
          id="$(node .github/scripts/own-lock.mjs "$errors")" || return 1
          if [ -z "$id" ]; then
            grep -Eq '"code": 50[234]|UNAVAILABLE' "$errors"
            return
          fi
          echo "::warning::tofu failed on this runner's own state lock $id; releasing it."
          tofu -chdir="$ROOT" force-unlock -force "$id" || return 1
        }
        # A plan changes nothing, so a transient error is retried for two minutes; any other error
        # fails at once. The two minutes start at the first failure, since Google's client can retry
        # within one attempt for minutes. transient runs first, so a late failure releases its lock.
        run_plan() {
          local deadline=""
          until attempt; do
            deadline="${deadline:-$((SECONDS + 120))}"
            if ! transient || [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/plan.txt" "$errors" 2>/dev/null || true
              exit 1
            fi
            echo "::warning::Google answered a transient error while planning; retrying in 10 seconds."
            sleep 10
          done
          cat "$errors" >&2
          tofu -chdir="$ROOT" show -json tfplan >"$RUNNER_TEMP/plan.json"
        }
        run_plan
        echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
        echo "plan=$RUNNER_TEMP/plan.json" >>"$GITHUB_OUTPUT"
        # The log lists each change and the fields it touches; values stay in the job summary.
        jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | (.change.actions | join("+")) + " " + .address
          + (if .change.actions == ["update"] then " (" + ([.change.before, .change.after] as [$b, $a]
          | [$a | keys[] | select($b[.] != $a[.])] | join(", ")) + ")" else "" end)' "$RUNNER_TEMP/plan.json"
        # An output-only plan prints neither "Plan:" nor "No changes".
        summary="$(grep -E '^(Plan:|Changes to Outputs:|No changes)' "$RUNNER_TEMP/plan.txt" || true)"
        echo "$summary"
        {
          echo "### \`$ROOT\`"
          echo "$summary"
          echo '<details><summary>Plan</summary>'
          echo
          echo '```'
          sed -n -E '/^(OpenTofu will perform|Changes to Outputs:)/,$p' "$RUNNER_TEMP/plan.txt"
          echo '```'
          echo '</details>'
        } >>"$GITHUB_STEP_SUMMARY"

    - name: Enforce the deletion and downtime policies
      shell: bash
      env:
        ALLOW_DELETION: ${{ inputs.allow_deletion }}
        ALLOW_DOWNTIME: ${{ inputs.allow_downtime }}
        POLICY: ${{ github.action_path }}/policy.jq
      run: |
        set -euo pipefail
        verdict="$(jq -f "$POLICY" "$RUNNER_TEMP/plan.json")"
        if jq -e '.failed_checks | length > 0' <<<"$verdict" >/dev/null; then
          echo "::error::Failing checks: $(jq -c .failed_checks <<<"$verdict")"
          exit 1
        fi
        if jq -e '(.deletions + .weakened) | length > 0' <<<"$verdict" >/dev/null && [ "$ALLOW_DELETION" != "true" ]; then
          echo "::error::This plan deletes or unprotects resources; it needs the allow-resource-deletion label: $(jq -c '.deletions + .weakened' <<<"$verdict")"
          exit 1
        fi
        # A merged database host change is applied regardless; deploy rolls it out only during a
        # planned downtime. A major upgrade runs as soon as it applies, so a deploy applies it only
        # during one. Pull requests are where either waits for its downtime.
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          for service in $(jq -r '.major_upgrades[]' <<<"$verdict"); do
            if [ "$(node .github/scripts/downtime.mjs started "service-$service.database")" != true ]; then
              echo "::error::The PostgreSQL major upgrade of $service applies only during its planned downtime; deploy again once it starts."
              exit 1
            fi
          done
          exit 0
        fi
        services="$(jq -r '[.downtime_changes[].service] | unique | .[]' <<<"$verdict")"
        [ -n "$services" ] || exit 0
        if [ "$ALLOW_DOWNTIME" != true ]; then
          echo "::error::This plan stops the databases of $(paste -sd, <<<"$services"); it needs the allow-downtime label during their planned downtime."
          exit 1
        fi
        for service in $services; do
          if [ "$(node .github/scripts/downtime.mjs started "service-$service.database")" != true ]; then
            echo "::error::No planned downtime in progress lists service-$service.database; schedule one with downtime.yaml, then re-run this check."
            exit 1
          fi
        done

    # A release image deploys only from an immutable Release the release App published, built by
    # that tag's own run, and never below the version already deployed.
    - name: Verify release provenance
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: node "$GITHUB_WORKSPACE/.github/scripts/provenance.mjs" "$RUNNER_TEMP/plan.json"

    - name: Copy release images to Artifact Registry
      if: inputs.apply == 'true' && steps.plan.outputs.changes == 'true'
      shell: bash
      env:
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token || steps.auth_retry.outputs.access_token }}
      run: |
        set -euo pipefail
        jq -r '.planned_values.outputs.image_copies.value[]?.target | split("/")[0]' "$RUNNER_TEMP/plan.json" | sort -u |
          while read -r registry; do
            skopeo login -u oauth2accesstoken --password-stdin "$registry" <<<"$ACCESS_TOKEN" >/dev/null
          done
        jq -r '.planned_values.outputs.image_copies.value[]? | "\(.source) \(.target)"' "$RUNNER_TEMP/plan.json" |
          while read -r source target; do
            digest="${source##*@}"
            # Immutable tags make the copy fail if the tag already names another image.
            if ! skopeo inspect --raw "docker://${target%:*}@$digest" >/dev/null 2>&1; then
              skopeo copy --all --preserve-digests "docker://${source%%:*}@$digest" "docker://$target"
            fi
          done

    - name: Apply
      if: inputs.apply == 'true' && steps.plan.outputs.changes == 'true'
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        output="$RUNNER_TEMP/apply.txt"
        if tofu -chdir="$ROOT" apply -input=false -no-color tfplan 2>&1 | tee "$output"; then
          exit 0
        fi
        # A failed apply is not retried, but a lock it left as this runner's own would fail every
        # later deploy.
        id="$(node .github/scripts/own-lock.mjs "$output")"
        if [ -n "$id" ]; then
          echo "::warning::tofu failed on this runner's own state lock $id; releasing it."
          tofu -chdir="$ROOT" force-unlock -force "$id"
        fi
        exit 1
