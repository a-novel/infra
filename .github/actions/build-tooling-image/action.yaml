name: Build and scan a tooling image
description: Export one credential-free linux/amd64 image for CI inspection or protected publication.
inputs:
  image_name:
    description: Reviewed Dockerfile basename under builds
    default: host-credentials
  trivy_installed:
    description: '"true" when an earlier step of the job installed this Trivy version, which the scan then reuses'
    default: "false"
runs:
  using: composite
  steps:
    # One builder per job shares build layers and the Go build cache across the tooling images. It
    # dies with the hosted runner, so no build state reaches another run and removing it only costs time.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      id: builder
      with:
        name: infra-tooling-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        cleanup: false

    - name: Build without publishing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: .
        file: builds/${{ inputs.image_name }}.Dockerfile
        platforms: linux/amd64
        tags: ${{ inputs.image_name }}:build
        outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
        push: false
        provenance: false
        pull: true

    - name: Scan the exact archive
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_DISABLE_TELEMETRY: "true"
      with:
        input: ${{ runner.temp }}/${{ inputs.image_name }}.tar
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        exit-code: "1"
        format: table
        hide-progress: true
        cache: false
        skip-setup-trivy: ${{ inputs.trivy_installed }}
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        version: v0.75.0
