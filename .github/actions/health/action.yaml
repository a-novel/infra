name: Production health
description: >
  Fails unless Authentication reports PostgreSQL, SMTP and JSON Keys up, through the health check
  every service shares (modules/service-runtime/smoke.sh). The caller must check out this
  repository, already hold Google credentials that can read the Cloud Run service, set ID_TOKEN to
  an ID token Authentication's IAM admits, and set DOWNTIME to the planned downtime: once it starts,
  the listed services refuse work on purpose until it is cleared, and the check is skipped.

runs:
  using: composite
  steps:
    - name: Check Authentication and its dependencies
      shell: bash
      run: |
        set -euo pipefail
        lookup() {
          gcloud run services describe agora-authentication-rest \
            --project=a-novel-public-api-prod --region=europe-west1 --format='value(status.url)'
        }
        # gcloud re-fetches the GitHub OIDC token here, and that request can time out.
        url="$(lookup || { sleep 15; lookup; })"
        DOWNTIME_START="$(jq -r '.start // empty' <<<"${DOWNTIME:-}")" PROTOCOL=http SERVICE_URL="$url" \
          HEALTH_PATH=/v2/healthcheck IDENTITY_TOKEN="$ID_TOKEN" TMPDIR="$RUNNER_TEMP" \
          sh "$GITHUB_WORKSPACE/modules/service-runtime/smoke.sh"
