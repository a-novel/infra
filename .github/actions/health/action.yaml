name: Production health
description: >
  Fails unless Authentication reports PostgreSQL, SMTP and JSON Keys up. The caller must
  already hold Google credentials that can read the Cloud Run service, set ID_TOKEN to an ID
  token Authentication's IAM admits, and set DOWNTIME to the planned downtime: once it starts,
  the listed services refuse work on purpose until it is cleared, and the check is skipped.

runs:
  using: composite
  steps:
    - name: Check Authentication and its dependencies
      shell: bash
      run: |
        set -euo pipefail
        skip_if_started() {
          if [ -n "${DOWNTIME:-}" ] && [ "$(date -d "$(jq -r .start <<<"$DOWNTIME")" +%s)" -le "$(date +%s)" ]; then
            echo "::notice::Planned downtime started for $(jq -r '.components | join(", ")' <<<"$DOWNTIME"); health check skipped."
            exit 0
          fi
        }
        skip_if_started
        lookup() {
          gcloud run services describe agora-authentication-rest \
            --project=a-novel-public-api-prod --region=europe-west1 --format='value(status.url)'
        }
        # gcloud re-fetches the GitHub OIDC token here, and that request can time out.
        url="$(lookup || { sleep 15; lookup; })"
        # The retries also cover a fresh invoker grant, which takes a minute or two to apply. curl
        # empties its output file before each retry, which it cannot do for a pipe, so jq reads only
        # the last answer.
        body="$RUNNER_TEMP/health.json"
        if ! curl -sS --fail-with-body --retry 12 --retry-all-errors --retry-delay 10 --max-time 15 \
          -H "Authorization: Bearer $ID_TOKEN" -o "$body" "$url/v2/healthcheck"; then
          cat "$body" >&2
        elif tee /dev/stderr <"$body" | jq -e 'length == 3 and all(.[]; .status == "up")' >/dev/null; then
          exit 0
        fi
        # A check that began just before the downtime fails once the services stop.
        skip_if_started
        exit 1
