name: production foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a 24-hour plan, or apply one exact prior plan ID.
        required: true
        type: choice
        options: [plan, apply]
      root:
        description: Management, shared workload, service foundation or create-only service jobs.
        required: true
        type: choice
        options: [bootstrap, foundation, service-foundation, service-release]
      service:
        description: Required for either service root; leave none for legacy roots.
        required: true
        default: none
        type: choice
        options: [none, json-keys, authentication]
      plan_id:
        description: Required only for apply; use the run-id-attempt printed by plan.
        required: false
        type: string

run-name: "foundation ${{ inputs.operation }} ${{ inputs.root }}${{ inputs.service != 'none' && inputs.service != '' && format('/{0}', inputs.service) || '' }} by @${{ github.actor }}"

permissions: {}

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  execute:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-foundation
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Select and authorize the protected inputs
        id: inputs
        shell: bash
        env:
          BOOTSTRAP_CONFIG: ${{ secrets.BOOTSTRAP_TFVARS_JSON }}
          FOUNDATION_CONFIG: ${{ secrets.FOUNDATION_TFVARS_JSON }}
          SERVICE_FOUNDATION_CONFIG: ${{ secrets.SERVICE_FOUNDATIONS_JSON }}
          SERVICE_FOUNDATIONS_ENABLED: ${{ vars.SERVICE_FOUNDATIONS_ENABLED }}
          SERVICE_JOB_BOOTSTRAP_CONFIG: ${{ secrets.SERVICE_JOB_BOOTSTRAPS_JSON }}
          SERVICE_JOB_BOOTSTRAP_ENABLED: ${{ vars.SERVICE_JOB_BOOTSTRAP_ENABLED }}
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          SELECTED_ROOT: ${{ inputs.root }}
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          infra foundation-inputs prepare "${SELECTED_ROOT}" "${SELECTED_SERVICE}" \
            "${RUNNER_TEMP}/selected.tfvars.json" >>"${GITHUB_OUTPUT}"

      - name: Authenticate as the foundation boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Bind the approved foundation generation
        if: inputs.root == 'service-release'
        id: coordinates
        shell: bash
        env:
          FOUNDATION_URI: ${{ steps.inputs.outputs.foundation_uri }}
          SELECTED_FILE: ${{ steps.inputs.outputs.file }}
          FOUNDATION_CONFIG: ${{ secrets.FOUNDATION_TFVARS_JSON }}
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          SERVICE_JOB_BOOTSTRAP_ENABLED: ${{ vars.SERVICE_JOB_BOOTSTRAP_ENABLED }}
        run: |
          set -euo pipefail
          umask 077
          coordinates="${RUNNER_TEMP}/foundation-coordinates.json"
          if ! gcloud storage cp "${FOUNDATION_URI}" "${coordinates}" --quiet >/dev/null 2>&1; then
            printf 'The approved foundation generation could not be read.\n' >&2
            exit 1
          fi
          infra foundation-inputs bind "${SELECTED_FILE}" "${coordinates}" \
            "${RUNNER_TEMP}/service-jobs.tfvars.json" >>"${GITHUB_OUTPUT}"

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Create the exact private plan
        if: inputs.operation == 'plan'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_NAME: ${{ inputs.root }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          TFVARS_FILE: ${{ steps.coordinates.outputs.file || steps.inputs.outputs.file }}
          TOFU_STATE_SUFFIX: ${{ steps.inputs.outputs.state_suffix }}
          FOUNDATION_CONFIG: ${{ secrets.FOUNDATION_TFVARS_JSON }}
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          SERVICE_JOB_BOOTSTRAP_ENABLED: ${{ vars.SERVICE_JOB_BOOTSTRAP_ENABLED }}
        run: |
          set -euo pipefail
          plan_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./ops/create-reviewed-plan.sh \
            "${ROOT_NAME}" "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${TFVARS_FILE}"
          printf 'Plan ID: %s\n' "${plan_id}"

      - name: Apply only the selected private plan
        if: inputs.operation == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ inputs.plan_id }}
          ROOT_NAME: ${{ inputs.root }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          TFVARS_FILE: ${{ steps.coordinates.outputs.file || steps.inputs.outputs.file }}
          TOFU_STATE_SUFFIX: ${{ steps.inputs.outputs.state_suffix }}
          FOUNDATION_CONFIG: ${{ secrets.FOUNDATION_TFVARS_JSON }}
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          SERVICE_JOB_BOOTSTRAP_ENABLED: ${{ vars.SERVICE_JOB_BOOTSTRAP_ENABLED }}
        run: |
          set -euo pipefail
          if ! [[ "${PLAN_ID}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            printf 'Apply requires the exact run-id-attempt printed by plan.\n' >&2
            exit 64
          fi
          ./ops/apply-reviewed-plan.sh \
            "${ROOT_NAME}" "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${PLAN_ID}" "${TFVARS_FILE}"
          infra custody config publish \
            "${STATE_BUCKET}" "${ROOT_NAME}" "${TFVARS_FILE}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
