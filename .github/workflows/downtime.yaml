name: downtime

# Schedules, changes or clears the one planned downtime, publishes it for the platform, then
# applies it with a full deploy. It is the only writer of the DOWNTIME variable and of the
# downtime branch, and only repository admins run it.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Schedule (or replace) the downtime, or clear it.
        type: choice
        options: [schedule, clear]
      components:
        description: Comma-separated components it stops, such as "service-json-keys.database".
        type: string
        default: ""
      start:
        description: When their services stop, in RFC 3339 UTC, such as 2026-10-12T06:00:00Z.
        type: string
        default: ""
      end:
        description: When service is expected back, in RFC 3339 UTC. Users see it; services ignore it.
        type: string
        default: ""

permissions: {}

concurrency:
  group: downtime
  cancel-in-progress: false

jobs:
  downtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      # Publishes the document on the downtime branch.
      contents: write
    outputs:
      previous: ${{ vars.DOWNTIME }}
      window: ${{ steps.window.outputs.window }}
    steps:
      # workflow_dispatch is open to anyone with write access.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.58.1
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the downtime
        id: window
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          COMPONENTS: ${{ inputs.components }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = clear ]; then
            echo "window=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Each service root has a database that can be stopped.
          known="$(find environments/production -mindepth 1 -maxdepth 1 -type d ! -name foundation -printf 'service-%f.database\n')"
          for component in ${COMPONENTS//,/ }; do
            if ! grep -qx "$component" <<<"$known"; then
              echo "::error::Unknown component \"$component\"; known: $(paste -sd, <<<"$known")."
              exit 1
            fi
          done
          rfc3339='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if [ -z "${COMPONENTS//[, ]/}" ] || ! [[ $START =~ $rfc3339 && $END =~ $rfc3339 ]] ||
            [ "$(date -d "$END" +%s)" -le "$(date -d "$START" +%s)" ]; then
            echo "::error::A downtime needs components, and start and end in RFC 3339 UTC with the end after the start."
            exit 1
          fi
          window="$(jq -cn --arg components "$COMPONENTS" --arg start "$START" --arg end "$END" \
            '{components: ($components | split(",") | map(select(. != ""))), start: $start, end: $end}')"
          echo "window=$window" >>"$GITHUB_OUTPUT"

      # The workflow token can't write variables; the agent App can.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Variables only. The action forwards every permission-* input to GitHub, including
          # this one it doesn't declare.
          permission-actions-variables: write

      - name: Write and publish DOWNTIME, then deploy
        shell: bash
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS: ${{ vars.DOWNTIME }}
          WINDOW: ${{ steps.window.outputs.window }}
        run: |
          set -euo pipefail
          # The platform reads downtime.json from the downtime branch: one orphan commit, replaced
          # on every run, holding the downtime or null. Commits by this token start no workflow.
          publish() {
            tree="$(jq -n --arg content "${WINDOW:-null}"$'\n' \
              '{tree: [{path: "downtime.json", mode: "100644", type: "blob", content: $content}]}' |
              gh api "repos/$REPOSITORY/git/trees" --input - --jq .sha)"
            # The commit-messages ruleset covers every branch, this one included.
            commit="$(gh api "repos/$REPOSITORY/git/commits" -f message="chore(downtime): publish ${WINDOW:-no planned downtime}" \
              -f tree="$tree" --jq .sha)"
            if gh api "repos/$REPOSITORY/git/ref/heads/downtime" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/downtime" -f sha="$commit" -F force=true >/dev/null
            else
              gh api "repos/$REPOSITORY/git/refs" -f ref=refs/heads/downtime -f sha="$commit" >/dev/null
            fi
          }

          # Any deploy applies DOWNTIME, so users see a downtime before it is set and until it is
          # deleted. A failed schedule or clear leaves a stale notice, never an unannounced stop.
          if [ -n "$WINDOW" ]; then
            publish
            GH_TOKEN="$APP_TOKEN" gh variable set DOWNTIME --repo "$REPOSITORY" --body "$WINDOW"
          else
            if [ -n "$PREVIOUS" ]; then
              GH_TOKEN="$APP_TOKEN" gh variable delete DOWNTIME --repo "$REPOSITORY"
            fi
            publish
          fi

          gh workflow run deploy.yaml --repo "$REPOSITORY" --ref master
          {
            echo "Previous downtime: \`${PREVIOUS:-none}\`"
            echo
            echo "New downtime: \`${WINDOW:-none}\`, published at https://raw.githubusercontent.com/$REPOSITORY/downtime/downtime.json"
            echo
            echo "A full deploy is applying it."
          } >>"$GITHUB_STEP_SUMMARY"

  # Kept apart from the downtime: a failure here leaves the downtime applied, and "Re-run failed
  # jobs" retries only the announcements. A retry plans from its own clock, so it posts the change
  # and the reminders still ahead, never a burst of past ones.
  announce:
    needs: downtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Hands the announcements to Google Cloud Workflows.
      id-token: write
    steps:
      # Every post this downtime needs, in time order: the change itself now, then the reminders still
      # ahead. The countdowns are Discord timestamps, so a post written now still reads right when it
      # lands. Timestamps share one RFC 3339 UTC format, so they compare as strings.
      - name: Plan the announcements
        id: posts
        shell: bash
        env:
          PREVIOUS: ${{ needs.downtime.outputs.previous }}
          WINDOW: ${{ needs.downtime.outputs.window }}
        run: |
          set -euo pipefail
          # discord-post's palette (a-novel-kit/workflows) for the states these posts show.
          upcoming=15844367 in_progress=15105570 informational=3447003 succeeded=3066993 cancelled=9807270
          now="$(date +%s)"

          body() { # window, headline
            local start end minutes length=""
            start="$(date -d "$(jq -r .start <<<"$1")" +%s)" end="$(date -d "$(jq -r .end <<<"$1")" +%s)"
            minutes=$(((end - start) / 60))
            if ((minutes >= 60)); then length="$((minutes / 60)) h"; fi
            if ((minutes % 60)); then length="${length:+$length }$((minutes % 60)) min"; fi
            if [ -n "$2" ]; then printf '%s\n\n' "$2"; fi
            echo "**Affects**"
            # service-json-keys.database reads as "json-keys database".
            jq -r '.components[] | (capture("^service-(?<name>.+)\\.(?<part>[^.]+)$") // {name: ., part: ""})
              | "- **\(.name)** \(.part)"' <<<"$1"
            echo
            echo "**When**"
            echo "- **From** <t:$start:F>"
            echo "- **Back by** <t:$end:F> *(expected)*"
            echo "-# About ${length:-0 min} · shown in your time zone"
          }
          post() { # at, title, color, window, headline
            jq -cn --argjson at "$1" --arg title "$2" --argjson color "$3" --arg description "$(body "$4" "$5")" \
              '{at: $at, message: {embeds: [{title: $title, color: $color, description: $description}], allowed_mentions: {parse: []}}}'
          }

          posts=()
          if [ -n "$WINDOW" ]; then
            start="$(date -d "$(jq -r .start <<<"$WINDOW")" +%s)"
            countdown="## Starts <t:$start:R>"
            back="## Expected back <t:$(date -d "$(jq -r .end <<<"$WINDOW")" +%s):R>"
            headline="$countdown"
            if [ "$now" -ge "$start" ]; then headline="$back"; fi
            if [ -z "$PREVIOUS" ]; then
              posts+=("$(post "$now" "🗓️ Planned downtime scheduled" "$upcoming" "$WINDOW" "$headline")")
            elif jq -e --argjson previous "$PREVIOUS" \
              '.start == $previous.start and .components == $previous.components and .end > $previous.end' <<<"$WINDOW" >/dev/null; then
              posts+=("$(post "$now" "⏩ Planned downtime extended" "$informational" "$WINDOW" "$headline")")
            else
              posts+=("$(post "$now" "🔁 Planned downtime rescheduled" "$informational" "$WINDOW" "$headline")")
            fi
            for reminder in "604800 in 1 week" "86400 in 1 day" "21600 in 6 hours" "1800 in 30 minutes"; do
              at=$((start - ${reminder%% *}))
              if [ "$at" -gt "$now" ]; then posts+=("$(post "$at" "⏰ Planned downtime ${reminder#* }" "$upcoming" "$WINDOW" "$countdown")"); fi
            done
            if [ "$start" -gt "$now" ]; then posts+=("$(post "$start" "🚧 Planned downtime started" "$in_progress" "$WINDOW" "$back")"); fi
          elif [ -n "$PREVIOUS" ]; then
            if [ "$(date -d "$(jq -r .start <<<"$PREVIOUS")" +%s)" -le "$now" ]; then
              posts+=("$(post "$now" "✅ Planned downtime ended" "$succeeded" "$PREVIOUS" "")")
            else
              posts+=("$(post "$now" "✖️ Planned downtime cancelled" "$cancelled" "$PREVIOUS" "")")
            fi
          fi
          echo "posts=$(printf '%s\n' "${posts[@]}" | jq -cs '{posts: map(select(. != null))}')" >>"$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_DOWNTIME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DOWNTIME_SERVICE_ACCOUNT }}

      # Google Cloud Workflows runs the announcements, because GitHub starts scheduled workflows
      # hours late. The execution sleeps until each post and reads the webhook only then. A new
      # execution replaces the pending one, which still knows the previous downtime.
      - name: Replace the pending announcements
        shell: bash
        env:
          POSTS: ${{ steps.posts.outputs.posts }}
          # gcloud asks before cancelling, and no one answers in CI.
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          where=(--location=europe-west1 --project=a-novel-management-prod)
          while read -r execution; do
            gcloud workflows executions cancel "$execution" --workflow=downtime-announcements "${where[@]}" --quiet >/dev/null
          done < <(gcloud workflows executions list downtime-announcements "${where[@]}" \
            --filter='state=ACTIVE' --format='value(name.basename())')
          if [ "$(jq '.posts | length' <<<"$POSTS")" -gt 0 ]; then
            gcloud workflows execute downtime-announcements "${where[@]}" --data="$POSTS" >/dev/null
          fi
          echo "Announcements scheduled: $(jq -r '[.posts[].message.embeds[0].title] | join(", ")' <<<"$POSTS")" >>"$GITHUB_STEP_SUMMARY"

      - name: Explain a failure
        if: failure()
        shell: bash
        run: |
          echo "::error::The downtime itself is applied. Only its announcements failed: fix the cause, then use Re-run failed jobs, which replaces the pending announcements."
