name: main

on:
  push:
    branches: [master]
    tags-ignore: ["**"]
  pull_request:
    # Label changes re-run the plans so the deletion label takes effect at once.
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate-opentofu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0
          cache: true

      - name: Format, validate, test and lint every root and tested module
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: |
          set -euo pipefail
          tofu fmt -check -recursive -diff
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
          for dir in bootstrap environments/production/* environments/recovery $(dirname modules/*/tests | sort -u); do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly -no-color >/dev/null
            tofu -chdir="$dir" validate -no-color
            tofu -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

  scan-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure, dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_INCLUDE_DEV_DEPS: "true"
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
          cache: false
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0

      - name: Build and scan the host credential loader
        uses: $/.github/actions/build-tooling-image
        with:
          image_name: host-credentials

      - name: Build and scan the restore worker
        uses: $/.github/actions/build-tooling-image
        with:
          image_name: native-restore

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint formatting, Go and Renovate configuration
        shell: bash
        env:
          # renovate: datasource=npm depName=prettier
          prettier_version: 3.9.9
          # renovate: datasource=npm depName=renovate
          renovate_version: 44.147.0
        run: |
          set -euo pipefail
          npx --yes "prettier@$prettier_version" --no-config --no-editorconfig --check .
          npx --yes --package "renovate@$renovate_version" -- renovate-config-validator --strict
          go tool -modfile=golangci-lint.mod golangci-lint run ./...

      - name: Lint shell scripts
        uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.42.0
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.42.0
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.30.1"

  test-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test the programs that run on the database and recovery hosts
        shell: bash
        run: go test -race ./internal/hostcredentials/... ./internal/recovery/...

  test-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the backup tests inside each database image
        shell: bash
        run: |
          set -euo pipefail
          for service in json-keys authentication; do
            docker build -f builds/backup-test.Dockerfile --build-arg DATABASE_SERVICE="$service" -t "backup-test:$service" .
            docker run --rm --network=none --read-only --cap-drop=all \
              --security-opt=no-new-privileges --cpus=1 --memory=2g --pids-limit=128 \
              --tmpfs=/tmp:rw,size=1g,mode=1777 "backup-test:$service"
          done

  # Each root's plan is its own required check. GitHub issues no OIDC token to
  # fork pull requests, so their plans fail until a maintainer pushes the branch.
  plan-bootstrap:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: bootstrap
          allow_deletion: ${{ contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-foundation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/foundation
          allow_deletion: ${{ contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-json-keys:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/json-keys
          allow_deletion: ${{ contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-authentication:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/authentication
          allow_deletion: ${{ contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
