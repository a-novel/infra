name: main

on:
  push:
    branches: [master]
    tags-ignore: ["**"]
  pull_request:
    # Label changes re-run the plans so the deletion label takes effect at once.
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  validate-opentofu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.65.0
          cache: true

      - name: Format, validate, test and lint every root and tested module
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: |
          set -euo pipefail
          tofu fmt -check -recursive -diff
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
          for dir in bootstrap environments/production/* environments/recovery* $(dirname modules/*/tests | sort -u); do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly -no-color >/dev/null
            tofu -chdir="$dir" validate -no-color
            tofu -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

  scan-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure, dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_INCLUDE_DEV_DEPS: "true"
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          scan-type: fs
          scan-ref: .
          # The deploy's admission check sends these manifests because they break the rules.
          skip-dirs: environments/production/cluster/tests/admission/refused
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
          cache: false
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0

  # The fleet's gitleaks rules, beside trivy's secret scanner above.
  scan-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.81.3
        with:
          config: .gitleaks.toml
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Lint formatting and Renovate configuration
        shell: bash
        env:
          # renovate: datasource=npm depName=prettier
          prettier_version: 3.9.10
          # renovate: datasource=npm depName=renovate
          renovate_version: 44.192.2
        run: |
          set -euo pipefail
          npx --yes "prettier@$prettier_version" --no-config --no-editorconfig --check .
          npx --yes --package "renovate@$renovate_version" -- renovate-config-validator --strict

      - name: Test the workflow scripts
        shell: bash
        run: node --test '.github/scripts/*.test.mjs'

      - name: Check every service root is planned, deployed and drift-checked
        shell: bash
        run: .github/scripts/check-service-roots.sh

      - name: Lint shell scripts
        uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.81.3
        with:
          # renovate: datasource=custom.shellcheck depName=koalaman/shellcheck
          version: "0.11.0"
          sha256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          # actionlint below checks the workflows' steps but never reads a composite action.
          run_steps: .github/actions/*/action.yaml

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          cache: false
          # Checks the workflows' run steps with the shellcheck that lint-shell installed above.
          shellcheck: true
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.81.3
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9"

  # The deletion label approves the plans of the head it was added on. A push's plans ignore it, and
  # this job removes it so a maintainer can add it again for the new head.
  revoke-deletion-label:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the deletion label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label allow-resource-deletion

  # The downtime label works the same way: it approves PostgreSQL major upgrades for the head it was
  # added on, during that service's planned downtime.
  revoke-downtime-label:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'allow-downtime')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the downtime label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label allow-downtime

  # Each root's plan is its own required check. GitHub issues no OIDC token to
  # fork pull requests, so their plans fail until a maintainer pushes the branch.
  plan-bootstrap:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: bootstrap
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-foundation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/foundation
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-json-keys:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/json-keys
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-genai:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/genai
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-authentication:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/authentication
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-account:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/account
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-studio:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/studio
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          allow_downtime: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-downtime') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-cluster:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/cluster
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  plan-grafana:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/tofu
        with:
          root: environments/production/grafana
          allow_deletion: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Plans repository config. Deploys and the drift check refresh it with the Deploy App.
  plan-github:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      ALLOW_DELETION: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'allow-resource-deletion') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit's first parent is the base the pull request merges into.
          fetch-depth: 2
          persist-credentials: false

      # Each plan reads every repository's workflows through the Plan App, whose hourly budget all
      # pull requests share. It runs only when the merge would apply the root: when the pull request
      # changes what the root depends on, or carries the deletion label, which makes the deploy prune.
      - id: changes
        name: Check whether the merge applies the root
        shell: bash
        run: |
          set -euo pipefail
          changes="$(.github/scripts/root-changes.sh environments/production/github HEAD^ HEAD)"
          if [ -n "$changes" ] || [ "$ALLOW_DELETION" = true ]; then
            echo "plan=true" >>"$GITHUB_OUTPUT"
          else
            echo "plan=false" >>"$GITHUB_OUTPUT"
            echo "Not planned: the pull request changes nothing the GitHub root depends on." >>"$GITHUB_STEP_SUMMARY"
          fi

      - id: tofu
        if: steps.changes.outputs.plan == 'true'
        uses: $/.github/actions/tofu
        with:
          root: environments/production/github
          allow_deletion: ${{ env.ALLOW_DELETION }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
          # GitHub hides bypass lists, merge settings and security settings from the read-only Plan
          # App, so the plan compares the configuration with what the last deploy applied.
          refresh: "false"

      # Lists the rulesets and deployment patterns the deploy would prune. Like a deletion in the
      # plan, each needs allow-resource-deletion.
      - name: Check what prune would delete
        if: steps.changes.outputs.plan == 'true'
        shell: bash
        env:
          PLAN: ${{ steps.tofu.outputs.plan }}
        run: |
          set -euo pipefail
          mode=check
          [ "$ALLOW_DELETION" != true ] || mode=report
          node .github/scripts/prune.mjs "$PLAN" plan "$mode"
