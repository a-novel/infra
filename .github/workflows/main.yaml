name: main

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate-opentofu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0
          cache: true

      # The operational policy tests execute the same receipt validator used by
      # protected releases, so they need the repository's pinned Node tooling.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install operational test tooling
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate reviewed roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap foundation release; do
            ./ops/check-root.sh "$root"
          done

      - name: Test the root and plan policies
        shell: bash
        run: ./tests/ops_test.sh

      - name: Lint shell scripts
        uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.29.1
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"

  scan-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
          cache: false
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install repository tooling
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Validate repository configuration
        shell: bash
        run: pnpm lint

      - name: Test the production manifest schema
        shell: bash
        run: pnpm test

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.29.1
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.29.0"
