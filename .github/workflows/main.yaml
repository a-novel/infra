name: main

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate-opentofu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0
          cache: true

      # The operational policy tests execute the same receipt validator used by
      # protected releases, so they need the repository's pinned Node tooling.
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install operational test tooling
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate reviewed roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap foundation release; do
            ./ops/check-root.sh "$root"
          done

      - name: Test the root and plan policies
        shell: bash
        run: ./tests/ops_test.sh

      - name: Lint shell scripts
        uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.29.1
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"

  scan-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
          cache: false
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install repository tooling
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Validate repository configuration
        shell: bash
        run: pnpm lint

      - name: Test release policies
        shell: bash
        run: pnpm test

      - name: Validate the production image transition
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "${BASE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'The pull-request base commit is invalid.\n' >&2
            exit 65
          fi
          base_manifest="${RUNNER_TEMP}/base-images.yaml"
          git show "${BASE_SHA}:deploy/production/images.yaml" >"${base_manifest}"
          ./ops/validate-image-update.mjs \
            "${base_manifest}" deploy/production/images.yaml

      # Compile with public fixtures before contacting GHCR. This exercises the
      # same schema, enabled-scope, and fixed release graph used in production.
      - name: Compile the production image candidate
        shell: bash
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_ACTION: deploy
        run: |
          set -euo pipefail
          umask 077
          ./ops/compile-release.mjs \
            deploy/production/images.yaml tests/fixtures/release-config.json - \
            "${RUNNER_TEMP}/release-preview"

      - name: Verify candidate provenance, digest, and PostgreSQL major
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/verify-release-images.sh "${RUNNER_TEMP}/release-preview/release.json"

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.29.1
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.29.0"
