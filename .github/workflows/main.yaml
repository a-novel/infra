name: main

on:
  push:
    branches: ["**", "!gh-readonly-queue/**"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  resource-deletion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # Only protected base-branch tooling may interpret the candidate's
      # metadata or trusted assessment artifact.
      - name: Check out trusted gate tooling
        uses: actions/checkout@v7.0.1
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'master' }}

      - name: Verify exact assessment and current approval
        shell: bash
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GATE_PULL_REQUEST: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -x ./trusted/ops/verify-resource-deletion-gate.sh ]; then
            printf '%s\n' \
              'The gate activates after its trusted base implementation merges.'
            exit 0
          fi
          ./trusted/ops/verify-resource-deletion-gate.sh "${GITHUB_REPOSITORY}"

  validate-opentofu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6.3.1
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0
          cache: true

      - name: Validate reviewed roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap foundation release; do
            ./ops/check-root.sh "$root"
          done
          tofu fmt -check -recursive modules
          tflint --recursive --chdir=modules --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact

      - name: Validate inactive service roots without backends
        shell: bash
        run: |
          set -euo pipefail
          for root in environments/service-foundation environments/service-release; do
            tofu -chdir="$root" fmt -check -recursive -diff
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly -no-color
            tofu -chdir="$root" validate -no-color
            tofu -chdir="$root" test -no-color
            tflint --chdir="$root" --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact
          done

      - name: Lint shell scripts
        uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.30.2
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"

  scan-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
          cache: false
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0

      - name: Build and scan the rollout verifier without credentials
        uses: $/.github/actions/build-rollout-verifier

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install repository tooling
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Validate repository configuration
        shell: bash
        run: pnpm lint

      - name: Install the operator runbook shell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh

      - name: Test tooling, runbooks, and workflow boundaries without credentials
        shell: bash
        run: go test -race ./...

      - name: Exercise the disposable physical-backup proof offline
        shell: bash
        run: |
          set -euo pipefail
          docker build -f builds/pgbackrest-proof.Dockerfile -t pgbackrest-proof:test .
          docker run --rm --network=none --read-only --cap-drop=all \
            --security-opt=no-new-privileges --cpus=1 --memory=2g --pids-limit=128 \
            --tmpfs=/tmp:rw,size=1g,mode=1777 pgbackrest-proof:test

      - name: Test the root, plan, and operator caller policies
        shell: bash
        run: ./tests/ops_test.sh

      - name: Validate the production image transition
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "${BASE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'The pull-request base commit is invalid.\n' >&2
            exit 65
          fi
          base_manifest="${RUNNER_TEMP}/base-images.yaml"
          git show "${BASE_SHA}:deploy/production/images.yaml" >"${base_manifest}"
          infra validate-images \
            "${base_manifest}" deploy/production/images.yaml

      - name: Resolve candidate versions and verify provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: infra preflight resolve-images deploy/production/images.yaml "${RUNNER_TEMP}/resolved-images.json"

      # Compile the verified snapshot with public configuration fixtures.
      - name: Compile the production image candidate
        shell: bash
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_ACTION: deploy
        run: |
          set -euo pipefail
          umask 077
          infra compile-release \
            "${RUNNER_TEMP}/resolved-images.json" tests/fixtures/release-config.json - \
            "${RUNNER_TEMP}/release-preview"

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

      - name: Audit GitHub Actions security
        uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.30.2
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.30.1"
