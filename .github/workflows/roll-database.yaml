name: roll-database

# Database hosts never restart on apply, and deploy rolls them only during their planned downtime.
# This manual fallback restarts a service's database host now, or replaces it when its template
# changed, keeping its disk and IP, then restarts its backup repository host.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service whose database and backup hosts move onto their applied configuration.
        type: choice
        options: [json-keys, authentication, genai]

permissions: {}

# The health check skips during a planned downtime.
env:
  DOWNTIME: ${{ vars.DOWNTIME }}

concurrency:
  group: roll-database-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # workflow_dispatch is open to anyone with write access.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.73.0
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The health check calls Authentication, which admits only IAM callers of its custom audience.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: agora-authentication-rest
      - uses: $/.github/actions/roll
        with:
          service: ${{ inputs.service }}
          force: "true"
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          roles: ${{ vars.DISCORD_REPO_ROLES }}
      - uses: $/.github/actions/health
        with:
          id_token: ${{ steps.google.outputs.id_token }}
