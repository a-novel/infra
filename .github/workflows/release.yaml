name: retained production operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan/apply retained resources, check permissions, or reconcile database isolation.
        required: true
        type: choice
        options:
          - plan
          - apply
          - check-release-permissions
          - drill-database-isolation
          - restore-database-isolation
      target_receipt:
        description: Isolation only; immutable run-id-attempt from the receipt inventory.
        required: false
        type: string
      plan_id:
        description: Apply only; exact run-id-attempt from a reviewed private plan.
        required: false
        type: string
      confirm_isolation:
        description: Isolation only; DRILL authentication or RESTORE authentication.
        required: false
        type: string

run-name: "production ${{ inputs.action }} by @${{ github.actor }}"

permissions: {}

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  RELEASE_ACTION: ${{ inputs.action }}

jobs:
  native:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      vars.PRODUCTION_RELEASES_ENABLED != 'true' &&
      (inputs.action == 'plan' || inputs.action == 'apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-release
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Authenticate as the release boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Read the last converged release configuration
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          infra custody operation check-legacy "${STATE_BUCKET}"
          infra custody config fetch "${STATE_BUCKET}" release "${RUNNER_TEMP}/release.json"

      - name: Create the exact private plan
        if: inputs.action == 'plan'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          plan_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./ops/create-reviewed-plan.sh release "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${RUNNER_TEMP}/release.json"
          printf 'Plan ID: %s\n' "${plan_id}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Apply only the selected private plan
        if: inputs.action == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          set -euo pipefail
          infra custody plan apply "${STATE_BUCKET}" release "${GITHUB_SHA}" \
            "${PLAN_ID}" "${RUNNER_TEMP}/release.json"

  release-permissions:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.action == 'check-release-permissions'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production-json-keys-private-release
            account: infra-json-keys-private@a-novel-production-prod.iam.gserviceaccount.com
            provider: r-fa8fb0969708fa1eae6efbaa7182
            scope: workloads/production/private/a-novel-production-prod/json-keys
            peer: workloads/production/public-api/a-novel-public-api-prod/authentication
          - environment: production-authentication-public-api-release
            account: infra-authentication-api@a-novel-public-api-prod.iam.gserviceaccount.com
            provider: r-c4ce9a8eb5aa6471505b4ef23ae7
            scope: workloads/production/public-api/a-novel-public-api-prod/authentication
            peer: workloads/production/private/a-novel-production-prod/json-keys
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build reviewed release tooling
        uses: $/.github/actions/setup-infra
      - name: Authenticate as the reviewed release boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/232403541574/locations/global/workloadIdentityPools/github-actions/providers/${{ matrix.provider }}
          service_account: ${{ matrix.account }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Check synthetic storage permissions
        shell: bash
        env:
          PERMISSION_CHECK_ENVIRONMENT: ${{ matrix.environment }}
          OWN_SCOPE: ${{ matrix.scope }}
          PEER_SCOPE: ${{ matrix.peer }}
        run: |
          set -euo pipefail
          infra custody permissions check \
            a-novel-management-prod-232403541574-tofu-state \
            "${OWN_SCOPE}" "${PEER_SCOPE}"
          printf 'PASS: own synthetic state create/read/replace/delete, append-only receipt, and peer get/create denials. No deployment or secret payload access.\n' >>"${GITHUB_STEP_SUMMARY}"

  database-isolation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      (inputs.action == 'drill-database-isolation' || inputs.action == 'restore-database-isolation') &&
      (vars.PRODUCTION_RELEASES_ENABLED == 'true' || inputs.action == 'restore-database-isolation')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate the manual isolation request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RECEIPT: ${{ inputs.target_receipt }}
          CONFIRMATION: ${{ inputs.confirm_isolation }}
        run: |
          set -euo pipefail
          [[ "${TARGET_RECEIPT}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          case "${RELEASE_ACTION}" in
            drill-database-isolation) [ "${CONFIRMATION}" = 'DRILL authentication' ] ;;
            restore-database-isolation) [ "${CONFIRMATION}" = 'RESTORE authentication' ] ;;
            *) exit 64 ;;
          esac
          [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)" = "${GITHUB_SHA}" ]

      - name: Build reviewed release tooling
        uses: $/.github/actions/setup-infra

      - name: Authenticate as the release boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Exercise or restore Authentication database isolation
        shell: bash
        env:
          RELEASE_CONFIG: ${{ secrets.RELEASE_CONFIG_JSON }}
          RECEIPT_BUCKET: ${{ vars.GCP_RECEIPT_BUCKET }}
          TARGET_RECEIPT: ${{ inputs.target_receipt }}
          CONFIRMATION: ${{ inputs.confirm_isolation }}
        run: |
          set -euo pipefail
          umask 077
          file="${RUNNER_TEMP}/isolation-config.json"
          trap 'rm -f -- "${file}"' EXIT
          printf '%s' "${RELEASE_CONFIG}" >"${file}"
          unset RELEASE_CONFIG
          infra database-isolation "${RELEASE_ACTION%%-*}" "${TARGET_RECEIPT}" "${CONFIRMATION}" "${file}"
