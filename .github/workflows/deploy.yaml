name: deploy

# Every merge to master applies the roots it changed, and every service root, so
# the services always run the current DOWNTIME. Service roots deploy in parallel,
# so a change one service needs from another merges first, on its own.
# A manual run applies every root, and so does the end of a downtime.yaml run,
# which changes DOWNTIME. Disable this workflow to freeze production.
on:
  push:
    branches: [master]
  workflow_dispatch:
  # A dispatch from downtime.yaml would run as github-actions[bot], which the
  # admin gate refuses. This run inherits the downtime run's triggering actor.
  # It applies only once that run's downtime job validated and set DOWNTIME.
  workflow_run: # zizmor: ignore[dangerous-triggers] It deploys master and reads nothing from the downtime run.
    workflows: [downtime]
    branches: [master]
    types: [completed]

permissions: {}

# A merge during a deploy waits for it; a newer merge replaces the waiting run.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      allow: ${{ steps.changes.outputs.allow }}
      apply: ${{ steps.changes.outputs.apply }}
      deploys: ${{ steps.changes.outputs.deploys }}
      commit: ${{ steps.changes.outputs.commit }}
      bootstrap: ${{ steps.changes.outputs.bootstrap }}
      foundation: ${{ steps.changes.outputs.foundation }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      # A manual or downtime run applies every root, and anyone with write access can start either.
      - if: github.event_name != 'push'
        uses: a-novel-kit/workflows/generic-actions/require-role@v1.76.0
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DOWNTIME_JOBS: ${{ github.event.workflow_run.jobs_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # The Agent App's label counts like a maintainer's, as review-gate counts it.
          AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # A downtime run whose downtime job failed set no DOWNTIME, so nothing applies. A failure
          # of its announcements alone still deploys the downtime it set.
          if [ "$EVENT" = workflow_run ] &&
            [ "$(gh api "$DOWNTIME_JOBS" --jq '.jobs[] | select(.name == "downtime") | .conclusion')" != success ]; then
            echo "apply=false" | tee -a "$GITHUB_OUTPUT"
            echo "The downtime run set no DOWNTIME, so nothing deploys." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "apply=true" >>"$GITHUB_OUTPUT"

          # Diff against the last successful deploy, not the previous commit, so
          # the changes of a failed or replaced run are deployed by the next one.
          base="$(gh run list --repo "$REPOSITORY" --workflow deploy.yaml --branch master --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            all=false
            commits="$(git rev-list "$base..HEAD")"
          else
            all=true
            commits=""
          fi
          # A manual or downtime run applies every root, and still honors every pull request since
          # the last successful deploy, plus the one that made HEAD.
          [ "$EVENT" != push ] && all=true
          commits="$(printf '%s\n%s\n' "$commits" "$(git rev-parse HEAD)" | sort -u | sed '/^$/d')"

          # A root depends on the action that applies it, its directory and the local modules it
          # calls, directly or through another module. The loop also visits each module it adds.
          deps() {
            local dirs=("$1") i source
            printf '%s\n' .opentofu-version .github/actions/tofu/ .github/workflows/deploy.yaml
            for ((i = 0; i < ${#dirs[@]}; i++)); do
              printf '%s/\n' "${dirs[i]}"
              while read -r source; do
                dirs+=("$(realpath --relative-to=. "${dirs[i]}/$source")")
              done < <(grep -ho 'source *= *"\.[^"]*"' "${dirs[i]}"/*.tf | sed -E 's/.*"(.*)"/\1/')
            done
          }
          changed() {
            [ "$all" = true ] && return
            local paths
            mapfile -t paths < <(deps "$1")
            # OpenTofu never reads Markdown, so documentation alone deploys nothing.
            [ -n "$(git diff --name-only "$base" HEAD -- "${paths[@]}" ':(exclude)*.md')" ]
          }

          # The service roots are the directories next to foundation, so a new one needs no edit here.
          mapfile -t services < <(find environments/production -mindepth 1 -maxdepth 1 -type d ! -name foundation -printf '%f\n' | sort)

          # Deletions are allowed when a pull request in this deploy carried the label when it merged.
          # shellcheck disable=SC2086 # One commit per word.
          allow="$(node .github/scripts/deletion-approval.mjs $commits)"

          # The loop records the roots that changed, which the announcement lists with each image's
          # new tag.
          roots="" deploys=false
          declare -A deployed=([bootstrap]=false [environments/production/foundation]=false)
          for dir in bootstrap environments/production/foundation "${services[@]/#/environments/production/}"; do
            changed "$dir" || continue
            deploys=true deployed[$dir]=true
            images=""
            if [ "$all" = false ]; then
              images="$(git diff --unified=0 "$base" HEAD -- "$dir/terraform.tfvars" |
                sed -nE 's/^\+ *([a-z-]+) *= *"[^"]*:([^@"]+)@.*/\1 \2/p' | paste -sd, - | sed 's/,/, /g')"
            fi
            roots+="- \`$(basename "$dir")\`${images:+: $images}"$'\n'
          done
          # Both posts name the commit that triggered the deploy, and its author's GitHub login: a
          # squash merge carries the profile name instead. The name stays as a fallback.
          author="$(gh api "repos/$REPOSITORY/commits/$(git rev-parse HEAD)" --jq '.author.login // empty' 2>/dev/null)" || author=""
          [ -n "$author" ] || author="$(git log -1 --format=%an HEAD)"
          commit="$(git log -1 --format="%s%n[\`%h\`]($SERVER_URL/$REPOSITORY/commit/%H)" HEAD) by $author"
          announcement="$roots"$'\n'"$commit"
          delimiter="EOF_$(openssl rand -hex 8)"
          printf '%s<<%s\n%s\n%s\n' announcement "$delimiter" "$announcement" "$delimiter" \
            commit "$delimiter" "$commit" "$delimiter" >>"$GITHUB_OUTPUT"

          {
            echo "deploys=$deploys"
            echo "bootstrap=${deployed[bootstrap]}"
            echo "foundation=${deployed[environments/production/foundation]}"
            echo "services=$(jq -cn '$ARGS.positional' --args "${services[@]}")"
            echo "allow=$allow"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Changes since ${base:-the first deploy}; every root: $all." >>"$GITHUB_STEP_SUMMARY"
      - name: Announce the deploy
        if: steps.changes.outputs.deploys == 'true'
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.76.0
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: started
          title: a-novel/infra · deploy started
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.changes.outputs.announcement }}

  bootstrap:
    needs: changes
    if: needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: bootstrap
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  foundation:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.foundation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/foundation
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Every deploy applies every service root, found on disk by the changes job, so the services run
  # the current DOWNTIME whichever deploy applies last: a downtime written while another deploy
  # waited or ran would otherwise reach no service. An unchanged root applies nothing.
  services:
    name: ${{ matrix.service }}
    needs: [changes, foundation]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.apply == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/${{ matrix.service }}
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Moves each service's hosts onto their applied configuration: the database host only during its
  # planned downtime, the backup repository VM whenever its config changed. It reads the hosts, not
  # this deploy's changes, so it runs on every deploy.
  rollout:
    needs: [changes, services]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.apply == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    concurrency:
      group: roll-database-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
      - uses: $/.github/actions/roll
        with:
          service: ${{ matrix.service }}
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          roles: ${{ vars.DISCORD_REPO_ROLES }}

  # Authentication's health covers PostgreSQL, SMTP and the JSON Keys path. It reports on
  # production whenever the service roots applied, even when one of them failed.
  health:
    needs: services
    if: ${{ !cancelled() && needs.services.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Authentication admits only IAM callers; the token names its custom audience.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: agora-authentication-rest
      - uses: $/.github/actions/health
        with:
          id_token: ${{ steps.google.outputs.id_token }}

  # Reports every deploy that applied a root, and any that failed. A failure pings a-novel/infra and
  # the role of each service whose root failed to apply.
  notify:
    needs: [changes, bootstrap, foundation, services, rollout, health]
    if: ${{ always() && (needs.changes.outputs.deploys == 'true' || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Names the failed jobs: a matrix reports one result for all its services.
      actions: read
    steps:
      - name: Summarize the outcome
        id: outcome
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SERVICES: ${{ needs.changes.outputs.services }}
          ROLES: ${{ vars.DISCORD_REPO_ROLES }}
          COMMIT: ${{ needs.changes.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$ROLES" ] || ROLES='{}'
          [ -n "$SERVICES" ] || SERVICES='[]'
          roles="" description="$COMMIT"
          if jq -e 'any(.[]; .result == "failure")' <<<"$NEEDS" >/dev/null; then
            # A service's apply job carries the service's name.
            failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .name' | jq -Rsc 'split("\n") | map(select(. != ""))')"
            outcome=failed description="Failed jobs: $(jq -r 'map("`\(.)`") | join(", ")' <<<"$failed")"$'\n\n'"$COMMIT"
            roles="$(jq -r --argjson roles "$ROLES" --argjson services "$SERVICES" '["a-novel/infra"]
              + [.[] | select(IN($services[])) | "a-novel/service-\(.)"] | map($roles[.] // empty) | join(" ")' <<<"$failed")"
          elif jq -e 'any(.[]; .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            outcome=cancelled
          else
            outcome=succeeded
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "outcome=$outcome"; echo "roles=$roles"; printf 'description<<%s\n%s\n%s\n' "$delimiter" "$description" "$delimiter"; } >>"$GITHUB_OUTPUT"
      - name: Post the outcome
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.76.0
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: ${{ steps.outcome.outputs.outcome }}
          title: a-novel/infra · deploy ${{ steps.outcome.outputs.outcome }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.outcome.outputs.description }}
          mention_roles: ${{ steps.outcome.outputs.roles }}
