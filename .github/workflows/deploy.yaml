name: deploy

# Every merge to master applies the roots it changed, and every service root, so
# the services always run the current DOWNTIME. Service roots deploy in parallel,
# so a change one service needs from another merges first, on its own.
# A manual run applies every root, and so does the end of a downtime.yaml run,
# which changes DOWNTIME. Disable this workflow to freeze production.
on:
  push:
    branches: [master]
  workflow_dispatch:
  # A dispatch from downtime.yaml would run as github-actions[bot], which the
  # admin gate refuses. This run inherits the downtime run's triggering actor.
  # It applies only once that run's downtime job validated and set DOWNTIME.
  workflow_run: # zizmor: ignore[dangerous-triggers] It deploys master and reads nothing from the downtime run.
    workflows: [downtime]
    branches: [master]
    types: [completed]

permissions: {}

# A merge during a deploy waits for it; a newer merge replaces the waiting run.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      allow: ${{ steps.changes.outputs.allow }}
      apply: ${{ steps.changes.outputs.apply }}
      deploys: ${{ steps.changes.outputs.deploys }}
      commit: ${{ steps.changes.outputs.commit }}
      bootstrap: ${{ steps.changes.outputs.bootstrap }}
      foundation: ${{ steps.changes.outputs.foundation }}
      cluster: ${{ steps.changes.outputs.cluster }}
      sentry: ${{ steps.changes.outputs.sentry }}
      grafana: ${{ steps.changes.outputs.grafana }}
      github: ${{ steps.changes.outputs.github }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      # A manual or downtime run applies every root, and anyone with write access can start either.
      - if: github.event_name != 'push'
        uses: a-novel-kit/workflows/generic-actions/require-role@v1.81.3
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DOWNTIME_JOBS: ${{ github.event.workflow_run.jobs_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # The Agent App's label counts like a maintainer's, as review-gate counts it.
          AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # A downtime run whose downtime job failed set no DOWNTIME, so nothing applies. A failure
          # of its announcements alone still deploys the downtime it set.
          if [ "$EVENT" = workflow_run ] &&
            [ "$(gh api "$DOWNTIME_JOBS" --jq '.jobs[] | select(.name == "downtime") | .conclusion')" != success ]; then
            echo "apply=false" | tee -a "$GITHUB_OUTPUT"
            echo "The downtime run set no DOWNTIME, so nothing deploys." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "apply=true" >>"$GITHUB_OUTPUT"

          # Diff against the last successful deploy, not the previous commit, so
          # the changes of a failed or replaced run are deployed by the next one.
          base="$(gh run list --repo "$REPOSITORY" --workflow deploy.yaml --branch master --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            all=false
            commits="$(git rev-list "$base..HEAD")"
          else
            all=true
            commits=""
          fi
          # A manual or downtime run applies every root, and still honors every pull request since
          # the last successful deploy, plus the one that made HEAD.
          [ "$EVENT" != push ] && all=true
          commits="$(printf '%s\n%s\n' "$commits" "$(git rev-parse HEAD)" | sort -u | sed '/^$/d')"

          # The service roots are the directories next to foundation, so a new one needs no edit here.
          # The cluster, Sentry, Grafana and GitHub roots apply only when they change, each in its own
          # job.
          mapfile -t services < <(find environments/production -mindepth 1 -maxdepth 1 -type d ! -name foundation ! -name cluster ! -name sentry ! -name grafana ! -name github -printf '%f\n' | sort)

          # Deletions are allowed when a pull request in this deploy carried the label when it merged.
          # shellcheck disable=SC2086 # One commit per word.
          allow="$(node .github/scripts/deletion-approval.mjs $commits)"

          # The loop records the roots that changed, which the announcement lists with each image's
          # new tag.
          roots="" deploys=false
          declare -A deployed=([bootstrap]=false [environments/production/foundation]=false [environments/production/cluster]=false [environments/production/sentry]=false [environments/production/grafana]=false [environments/production/github]=false)
          for dir in bootstrap environments/production/foundation environments/production/cluster environments/production/sentry environments/production/grafana environments/production/github "${services[@]/#/environments/production/}"; do
            if [ "$all" = false ]; then
              changes="$(.github/scripts/root-changes.sh "$dir" "$base" HEAD)"
              [ -n "$changes" ] || continue
            fi
            deploys=true deployed[$dir]=true
            images=""
            if [ "$all" = false ]; then
              images="$(git diff --unified=0 "$base" HEAD -- "$dir/terraform.tfvars" |
                sed -nE 's/^\+ *([a-z-]+) *= *"[^"]*:([^@"]+)@.*/\1 \2/p' | paste -sd, - | sed 's/,/, /g')"
            fi
            roots+="- \`$(basename "$dir")\`${images:+: $images}"$'\n'
          done
          # Both posts name the commit that triggered the deploy, and its author's GitHub login: a
          # squash merge carries the profile name instead. The name stays as a fallback.
          author="$(gh api "repos/$REPOSITORY/commits/$(git rev-parse HEAD)" --jq '.author.login // empty' 2>/dev/null)" || author=""
          [ -n "$author" ] || author="$(git log -1 --format=%an HEAD)"
          commit="$(git log -1 --format="%s%n[\`%h\`]($SERVER_URL/$REPOSITORY/commit/%H)" HEAD) by $author"
          announcement="$roots"$'\n'"$commit"
          delimiter="EOF_$(openssl rand -hex 8)"
          printf '%s<<%s\n%s\n%s\n' announcement "$delimiter" "$announcement" "$delimiter" \
            commit "$delimiter" "$commit" "$delimiter" >>"$GITHUB_OUTPUT"

          {
            echo "deploys=$deploys"
            echo "bootstrap=${deployed[bootstrap]}"
            echo "foundation=${deployed[environments/production/foundation]}"
            echo "cluster=${deployed[environments/production/cluster]}"
            echo "sentry=${deployed[environments/production/sentry]}"
            echo "grafana=${deployed[environments/production/grafana]}"
            echo "github=${deployed[environments/production/github]}"
            echo "services=$(jq -cn '$ARGS.positional' --args "${services[@]}")"
            echo "allow=$allow"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Changes since ${base:-the first deploy}; every root: $all." >>"$GITHUB_STEP_SUMMARY"
      - name: Announce the deploy
        if: steps.changes.outputs.deploys == 'true'
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.81.3
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: started
          title: a-novel/infra · deploy started
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.changes.outputs.announcement }}

  bootstrap:
    needs: changes
    if: needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: bootstrap
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  foundation:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.foundation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/foundation
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # The cluster's namespaces, add-ons and policies. It needs foundation's cluster and grants, and no
  # Cloud Run release waits on it.
  cluster:
    needs: [changes, bootstrap, foundation]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.cluster == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/cluster
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      - id: google
        if: ${{ !cancelled() }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          token_format: access_token
      # Admission must refuse each manifest that breaks Pod Security or an admission policy, and still
      # admit a compliant pod, which proves the refusals come from admission and not from access.
      # Dry runs persist nothing.
      - name: Check admission
        shell: bash
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          FIXTURES: environments/production/cluster/tests/admission
        run: |
          set -euo pipefail
          endpoint="$(tofu -chdir=environments/production/cluster output -raw api_endpoint)"
          status=0
          for fixture in "$FIXTURES"/admitted/*.json "$FIXTURES"/refused/*.json; do
            resource="$(jq -r '.kind | ascii_downcase' "$fixture")s"
            code="$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @"$fixture" \
              "https://$endpoint/api/v1/namespaces/json-keys/$resource?dryRun=All")"
            message="$(jq -r '.message // empty' "$RUNNER_TEMP/response.json")"
            case "$fixture:$code" in
              */admitted/*:201) echo "admitted $(basename "$fixture")" ;;
              */refused/*:403 | */refused/*:422)
                if grep -Eq 'violates PodSecurity|ValidatingAdmissionPolicy' <<<"$message"; then
                  echo "refused $(basename "$fixture"): $message"
                else
                  echo "::error::$(basename "$fixture") was refused, but not by admission: $message"
                  status=1
                fi
                ;;
              *)
                echo "::error::$(basename "$fixture") answered $code: $message"
                status=1
                ;;
            esac
          done
          exit "$status"
      # A database that never serves fails the apply on its wait, which says nothing of why. Its
      # conditions, stuck pods and warnings usually do. A failure before OpenTofu installs touched
      # nothing.
      - name: Describe the databases
        if: failure()
        shell: bash
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          set -uo pipefail
          command -v tofu >/dev/null || exit 0
          endpoint="$(tofu -chdir=environments/production/cluster output -raw api_endpoint)"
          get() { curl -sS -H "Authorization: Bearer $TOKEN" "https://$endpoint$1"; }
          for namespace in $(get /apis/postgresql.cnpg.io/v1/clusters | jq -r '.items[].metadata.namespace'); do
            echo "::group::$namespace"
            get "/apis/postgresql.cnpg.io/v1/namespaces/$namespace/clusters/database" |
              jq -r '.status | "phase: \(.phase)", (.conditions[]? | select(.status != "True") | "\(.type): \(.reason): \(.message)")'
            get "/api/v1/namespaces/$namespace/pods" |
              jq -r '.items[] | .metadata.name as $pod | (.status.conditions[]? | select(.status != "True" and .message) | "\($pod) \(.type): \(.message)"), ((.status.initContainerStatuses // []) + (.status.containerStatuses // []) | .[] | select(.state.waiting) | "\($pod)/\(.name): \(.state.waiting.reason): \(.state.waiting.message // "")")'
            get "/api/v1/namespaces/$namespace/events" |
              jq -r '[.items[] | select(.type == "Warning")] | sort_by(.lastTimestamp // .eventTime) | .[-10:][] | "\(.involvedObject.kind)/\(.involvedObject.name) \(.reason): \(.message)"'
            echo "::endgroup::"
          done

  # Sentry's configuration needs only bootstrap's token grants, and no release waits on it.
  sentry:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.sentry == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/sentry
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Grafana's alerts and dashboards need only bootstrap's token grants, and no release waits on them.
  # They apply from their own environment and identity, which read only Grafana's write tokens and
  # this root's state.
  grafana:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.grafana == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: grafana
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/grafana
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_GRAFANA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GRAFANA_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Repository config needs only bootstrap's key grants, and no release waits on it. It applies from
  # its own environment and identity, which hold no Google Cloud rights, and never beside the sweep.
  # A deploy that may delete runs it too, so allow-resource-deletion prunes from any pull request.
  github:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.github == 'true' || needs.changes.outputs.allow == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github
    concurrency:
      group: github-root
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/github
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      # Copies each repository's governance secrets at their pinned versions. No plan sees a value.
      - name: Sync governance secrets
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=environments/production/github output -json organizations >"$RUNNER_TEMP/organizations.json"
          node .github/scripts/secret-sync.mjs "$RUNNER_TEMP/organizations.json"
      # Writes back the settings the provider cannot manage yet, wherever a repository differs.
      - name: Assert repository settings
        shell: bash
        run: node .github/scripts/repository-asserts.mjs "$RUNNER_TEMP/organizations.json" --apply
      # Deletes the rulesets and deployment patterns the root does not produce, when a pull request
      # merged with allow-resource-deletion. Without it, any such object fails the job.
      - name: Prune
        shell: bash
        env:
          ALLOW_DELETION: ${{ needs.changes.outputs.allow }}
        run: |
          set -euo pipefail
          mode=check
          [ "$ALLOW_DELETION" != true ] || mode=apply
          tofu -chdir=environments/production/github show -json >"$RUNNER_TEMP/state.json"
          node .github/scripts/prune.mjs "$RUNNER_TEMP/state.json" deploy "$mode"

  # Every deploy applies every service root, found on disk by the changes job, so the services run
  # the current DOWNTIME whichever deploy applies last: a downtime written while another deploy
  # waited or ran would otherwise reach no service. An unchanged root applies nothing. The services
  # read their Sentry DSN from the Sentry root, so they wait for its job, which runs only when it
  # changes. They run even when it fails, on the outputs it last applied: a deploy re-runs every
  # root changed since the last successful one, so a failing Sentry root would otherwise hold
  # every release until it is fixed.
  services:
    name: ${{ matrix.service }}
    needs: [changes, bootstrap, foundation, sentry]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.apply == 'true' &&
      needs.bootstrap.result != 'failure' && needs.foundation.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tofu
        uses: $/.github/actions/tofu
        with:
          root: environments/production/${{ matrix.service }}
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      # Release CI creates each release in Sentry when it cuts the tag. This step records the
      # release's production deploy once the root serves it, and never fails the job.
      - name: Record the Sentry deploys
        shell: bash
        env:
          PLAN: ${{ steps.tofu.outputs.plan }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node .github/scripts/sentry-deploys.mjs "$PLAN"

  # Moves each service's hosts onto their applied configuration: the database host only during its
  # planned downtime, the backup repository VM whenever its config changed. It reads the hosts, not
  # this deploy's changes, so it runs on every deploy.
  rollout:
    needs: [changes, services]
    # failure() would also count a failed sentry job, an ancestor through the services.
    if: ${{ !cancelled() && needs.changes.outputs.apply == 'true' && needs.services.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    concurrency:
      group: roll-database-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
      - uses: $/.github/actions/roll
        with:
          service: ${{ matrix.service }}
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          roles: ${{ vars.DISCORD_REPO_ROLES }}

  # Reports every deploy that applied a root, and any that failed. A failure pings a-novel/infra and
  # the role of each service whose root failed to apply.
  notify:
    needs:
      - changes
      - bootstrap
      - foundation
      - cluster
      - sentry
      - grafana
      - github
      - services
      - rollout
    if: ${{ always() && (needs.changes.outputs.deploys == 'true' || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Names the failed jobs: a matrix reports one result for all its services.
      actions: read
    steps:
      - name: Summarize the outcome
        id: outcome
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SERVICES: ${{ needs.changes.outputs.services }}
          ROLES: ${{ vars.DISCORD_REPO_ROLES }}
          COMMIT: ${{ needs.changes.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$ROLES" ] || ROLES='{}'
          [ -n "$SERVICES" ] || SERVICES='[]'
          roles="" description="$COMMIT"
          if jq -e 'any(.[]; .result == "failure")' <<<"$NEEDS" >/dev/null; then
            # A service's apply job carries the service's name.
            failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .name' | jq -Rsc 'split("\n") | map(select(. != ""))')"
            outcome=failed description="Failed jobs: $(jq -r 'map("`\(.)`") | join(", ")' <<<"$failed")"$'\n\n'"$COMMIT"
            roles="$(jq -r --argjson roles "$ROLES" --argjson services "$SERVICES" '["a-novel/infra"]
              + [.[] | select(IN($services[])) | "a-novel/service-\(.)"] | map($roles[.] // empty) | join(" ")' <<<"$failed")"
          elif jq -e 'any(.[]; .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            outcome=cancelled
          else
            outcome=succeeded
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "outcome=$outcome"; echo "roles=$roles"; printf 'description<<%s\n%s\n%s\n' "$delimiter" "$description" "$delimiter"; } >>"$GITHUB_OUTPUT"
      - name: Post the outcome
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.81.3
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: ${{ steps.outcome.outputs.outcome }}
          title: a-novel/infra · deploy ${{ steps.outcome.outputs.outcome }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.outcome.outputs.description }}
          mention_roles: ${{ steps.outcome.outputs.roles }}
