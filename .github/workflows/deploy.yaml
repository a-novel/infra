name: deploy

# Every merge to master applies the roots it changed. Service roots deploy in
# parallel, so a change one service needs from another merges first, on its own.
# A manual run applies every root. Disable this workflow to freeze production.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# A merge during a deploy waits for it; a newer merge replaces the waiting run.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      allow: ${{ steps.changes.outputs.allow }}
      deploys: ${{ steps.changes.outputs.deploys }}
      commit: ${{ steps.changes.outputs.commit }}
      bootstrap: ${{ steps.changes.outputs.bootstrap }}
      foundation: ${{ steps.changes.outputs.foundation }}
      json_keys: ${{ steps.changes.outputs.json_keys }}
      authentication: ${{ steps.changes.outputs.authentication }}
    steps:
      # A manual run applies every root, and workflow_dispatch is open to anyone with write access.
      - if: github.event_name == 'workflow_dispatch'
        uses: a-novel-kit/workflows/generic-actions/require-role@v1.58.1
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Diff against the last successful deploy, not the previous commit, so
          # the changes of a failed or replaced run are deployed by the next one.
          base="$(gh run list --repo "$REPOSITORY" --workflow deploy.yaml --branch master --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            all=false
            commits="$(git rev-list "$base..HEAD")"
          else
            all=true
            commits=""
          fi
          # A manual run applies every root, and still honours every pull request since the last
          # successful deploy, plus the one that made HEAD.
          [ "$EVENT" = workflow_dispatch ] && all=true
          commits="$(printf '%s\n%s\n' "$commits" "$(git rev-parse HEAD)" | sort -u | sed '/^$/d')"

          # A root depends on the shared tooling, its directory and the local modules it calls.
          deps() {
            printf '%s\n' .opentofu-version .github/actions/ .github/workflows/deploy.yaml "$1/"
            { grep -ho 'source *= *"\.[^"]*"' "$1"/*.tf || true; } | sed -E 's/.*"(.*)"/\1/' | while read -r source; do
              deps "$(realpath --relative-to=. "$1/$source")"
            done
          }
          changed() {
            [ "$all" = true ] && return
            # OpenTofu never reads Markdown, so documentation alone deploys nothing.
            deps "$1" | awk 'NR == FNR { prefix[$0]; next } { for (p in prefix) if (index($0, p) == 1) found = 1 }
              END { exit !found }' - <(git diff --name-only "$base" HEAD -- . ':(exclude)*.md')
          }
          deploy() { changed "$1" && echo true || echo false; }

          # Service roots read foundation's outputs, so a foundation change re-plans them.
          bootstrap="$(deploy bootstrap)"
          foundation="$(deploy environments/production/foundation)"
          json_keys="$(deploy environments/production/json-keys)"
          authentication="$(deploy environments/production/authentication)"
          [ "$foundation" = true ] && json_keys=true authentication=true

          # Deletions are allowed when any pull request in this deploy carried the label.
          allow=false
          for sha in $commits; do
            labelled="$(gh api "repos/$REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null) | .labels[].name] | index("allow-resource-deletion") != null')"
            [ "$labelled" = true ] && allow=true
          done

          # The announcement lists the roots this deploy applies, with each image's new tag.
          roots="" deploys=false
          for root in bootstrap foundation json_keys authentication; do
            [ "${!root}" = true ] || continue
            deploys=true
            dir=environments/production/${root//_/-}
            [ "$root" = bootstrap ] && dir=bootstrap
            images=""
            if [ "$all" = false ]; then
              images="$(git diff --unified=0 "$base" HEAD -- "$dir/terraform.tfvars" |
                sed -nE 's/^\+ *([a-z-]+) *= *"[^"]*:([^@"]+)@.*/\1 \2/p' | paste -sd, - | sed 's/,/, /g')"
            fi
            roots+="- \`${root//_/-}\`${images:+: $images}"$'\n'
          done
          # Both posts name the commit that triggered the deploy, and its author's GitHub login: a
          # squash merge carries the profile name instead. The name stays as a fallback.
          author="$(gh api "repos/$REPOSITORY/commits/$(git rev-parse HEAD)" --jq '.author.login // empty' 2>/dev/null)" || author=""
          [ -n "$author" ] || author="$(git log -1 --format=%an HEAD)"
          commit="$(git log -1 --format="%s%n[\`%h\`]($SERVER_URL/$REPOSITORY/commit/%H)" HEAD) by $author"
          announcement="$roots"$'\n'"$commit"
          delimiter="EOF_$(openssl rand -hex 8)"
          printf '%s<<%s\n%s\n%s\n' announcement "$delimiter" "$announcement" "$delimiter" \
            commit "$delimiter" "$commit" "$delimiter" >>"$GITHUB_OUTPUT"

          tee -a "$GITHUB_OUTPUT" <<EOF
          deploys=$deploys
          bootstrap=$bootstrap
          foundation=$foundation
          json_keys=$json_keys
          authentication=$authentication
          allow=$allow
          EOF
          echo "Changes since ${base:-the first deploy}; every root: $all." >>"$GITHUB_STEP_SUMMARY"
      - name: Announce the deploy
        if: steps.changes.outputs.deploys == 'true'
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.58.1
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: started
          title: a-novel/infra · deploy started
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.changes.outputs.announcement }}

  bootstrap:
    needs: changes
    if: needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: bootstrap
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  foundation:
    needs: [changes, bootstrap]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.foundation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/foundation
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  json-keys:
    needs: [changes, foundation]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.json_keys == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/json-keys
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  authentication:
    needs: [changes, foundation]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.authentication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/authentication
          apply: "true"
          allow_deletion: ${{ needs.changes.outputs.allow }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}

  # Moves each service's hosts onto their applied configuration: the database host only during its
  # planned downtime, the backup repository VM whenever its config changed. It reads the hosts, not
  # this deploy's changes, so it runs on every deploy.
  rollout:
    needs: [json-keys, authentication]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [json-keys, authentication]
    concurrency:
      group: roll-database-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
      - uses: $/.github/actions/roll
        with:
          service: ${{ matrix.service }}
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          roles: ${{ vars.DISCORD_REPO_ROLES }}

  # Authentication's health covers PostgreSQL, SMTP and the JSON Keys path.
  health:
    needs: [json-keys, authentication]
    if: ${{ !cancelled() && !failure() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Authentication admits only IAM callers; the token names its custom audience.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: agora-authentication-rest
      - uses: $/.github/actions/health
        env:
          ID_TOKEN: ${{ steps.google.outputs.id_token }}

  # Reports every deploy that applied a root, and any that failed. A failure pings a-novel/infra and
  # the role of each service whose root failed to apply.
  notify:
    needs:
      [
        changes,
        bootstrap,
        foundation,
        json-keys,
        authentication,
        rollout,
        health,
      ]
    if: ${{ always() && (needs.changes.outputs.deploys == 'true' || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize the outcome
        id: outcome
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          ROLES: ${{ vars.DISCORD_REPO_ROLES }}
          COMMIT: ${{ needs.changes.outputs.commit }}
        run: |
          set -euo pipefail
          [ -n "$ROLES" ] || ROLES='{}'
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure") | "`\(.key)`"] | join(", ")' <<<"$NEEDS")"
          roles="" description="$COMMIT"
          if [ -n "$failed" ]; then
            outcome=failed description="Failed jobs: $failed"$'\n\n'"$COMMIT"
            roles="$(jq -r --argjson roles "$ROLES" '["a-novel/infra"] + [to_entries[]
              | select(.value.result == "failure" and (.key == "json-keys" or .key == "authentication"))
              | "a-novel/service-\(.key)"] | map($roles[.] // empty) | join(" ")' <<<"$NEEDS")"
          elif jq -e 'any(.[]; .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            outcome=cancelled
          else
            outcome=succeeded
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "outcome=$outcome"; echo "roles=$roles"; printf 'description<<%s\n%s\n%s\n' "$delimiter" "$description" "$delimiter"; } >>"$GITHUB_OUTPUT"
      - name: Post the outcome
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.58.1
        with:
          webhook: ${{ secrets.DEPLOY_WEBHOOK }}
          color: ${{ steps.outcome.outputs.outcome }}
          title: a-novel/infra · deploy ${{ steps.outcome.outputs.outcome }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.outcome.outputs.description }}
          mention_roles: ${{ steps.outcome.outputs.roles }}
