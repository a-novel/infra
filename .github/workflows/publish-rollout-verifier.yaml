# The filename is part of the existing verifier's attestation signer identity.
name: publish infrastructure tooling

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Reviewed tooling image to build
        type: choice
        default: rollout-verifier
        options:
          - rollout-verifier
          - host-credentials
          - native-restore
      publish:
        description: Publish the scanned image after environment approval (otherwise build and scan only)
        type: boolean
        default: false

run-name: ${{ inputs.tool }} ${{ inputs.publish && 'publish' || 'build only' }} at ${{ github.sha }}

permissions: {}

env:
  TOOL: ${{ inputs.tool }}

concurrency:
  group: rollout-verifier-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      tool: ${{ env.TOOL }}
    steps:
      - name: Reject an unapproved publication context
        if: >-
          github.repository != 'a-novel/infra' || github.ref != 'refs/heads/master' ||
          !contains(fromJSON('["rollout-verifier", "host-credentials", "native-restore"]'), inputs.tool) ||
          (inputs.publish && !(
            (inputs.tool == 'rollout-verifier' && vars.ROLLOUT_VERIFIER_PUBLICATION_ENABLED == 'true') ||
            (inputs.tool == 'host-credentials' && vars.HOST_CREDENTIALS_PUBLICATION_ENABLED == 'true') ||
            (inputs.tool == 'native-restore' && vars.NATIVE_RESTORE_PUBLICATION_ENABLED == 'true')
          ))
        shell: bash
        run: |
          printf '::error::Use a reviewed master commit. Publication also requires its explicit repository opt-in; see docs/runbooks/publish-rollout-verifier.md.\n'
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and scan the selected tool
        uses: $/.github/actions/build-tooling-image
        with:
          image_name: ${{ env.TOOL }}

      - name: Keep only the scanned image for publication
        id: archive
        if: inputs.publish
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.TOOL }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.TOOL }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    if: >-
      inputs.publish && github.repository == 'a-novel/infra' && github.ref == 'refs/heads/master' && (
        (inputs.tool == 'rollout-verifier' && vars.ROLLOUT_VERIFIER_PUBLICATION_ENABLED == 'true') ||
        (inputs.tool == 'host-credentials' && vars.HOST_CREDENTIALS_PUBLICATION_ENABLED == 'true') ||
        (inputs.tool == 'native-restore' && vars.NATIVE_RESTORE_PUBLICATION_ENABLED == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.tool == 'rollout-verifier' && 'rollout-artifacts' || 'host-artifacts' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/a-novel/infra/${{ needs.build.outputs.tool }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id || '0' }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error

      - name: Load the verified archive
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/${TOOL}.tar"
          docker tag "${TOOL}:build" "${IMAGE}"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the scanned image without rebuilding
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")"
          printf 'digest=%s\n' "${reference##*@}" >>"${GITHUB_OUTPUT}"

      - name: Attest the published digest
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/a-novel/infra/${{ env.TOOL }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Report the attested artifact
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Tooling artifact: `ghcr.io/a-novel/infra/%s@%s`\n\nSource: `%s`\n\nVerify provenance before promotion. This run does not deploy, start hosts or approve a rollout.\n' "${TOOL}" "${DIGEST}" "${GITHUB_SHA}" >>"${GITHUB_STEP_SUMMARY}"
