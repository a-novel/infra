name: recovery

# Plans, applies or destroys one root of a disaster-recovery drill in a
# disposable project: a database host's, or a cluster database's cluster and
# restored database. The drill itself follows docs/runbooks/recovery.md.
on:
  workflow_dispatch:
    inputs:
      root:
        description: The drill host, or a cluster drill's cluster or restored database.
        required: true
        type: choice
        options: [host, cluster, database]
      operation:
        description: Plan, apply or destroy the root.
        required: true
        type: choice
        options: [plan, apply, destroy]
      drill:
        description: JSON value of the root's `recovery` variable.
        required: true
        type: string

run-name: "recovery ${{ inputs.root }} ${{ inputs.operation }} by @${{ github.actor }}"

permissions: {}

concurrency:
  group: recovery
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  drill:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # A cluster takes about ten minutes, and a restore waits up to thirty.
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # workflow_dispatch is open to anyone with write access.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.81.1
        with:
          roles: admin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}

      - name: Run the drill operation
        shell: bash
        env:
          DRILL: ${{ inputs.drill }}
          OPERATION: ${{ inputs.operation }}
          ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          case "$ROOT" in
            host) dir=environments/recovery ;;
            *) dir="environments/recovery-$ROOT" ;;
          esac
          vars="$RUNNER_TEMP/drill.tfvars.json"
          jq -n --argjson recovery "$DRILL" '{recovery: $recovery}' >"$vars"
          tofu -chdir="$dir" init -input=false -lockfile=readonly -no-color -var-file="$vars"
          case "$OPERATION" in
            plan) tofu -chdir="$dir" plan -input=false -no-color -var-file="$vars" ;;
            apply) tofu -chdir="$dir" apply -input=false -no-color -auto-approve -var-file="$vars" ;;
            destroy) tofu -chdir="$dir" destroy -input=false -no-color -auto-approve -var-file="$vars" ;;
          esac
