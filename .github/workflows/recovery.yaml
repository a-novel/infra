name: production recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan/apply a disposable workload, restore exact data, or delete one reviewed drill project.
        required: true
        type: choice
        options: [plan-workload, apply-workload, restore-data, cleanup-project]
      replacement_project_id:
        description: New disposable Google Cloud project ID; never the production project.
        required: true
        type: string
      target_receipt:
        description: Immutable successful production run-id-attempt to recover.
        required: true
        type: string
      plan_id:
        description: apply-workload only; exact run-id-attempt printed by plan-workload.
        required: false
        type: string
      json_keys_attempt:
        description: restore-data only; exact JSON Keys backup attempt directory.
        required: false
        type: string
      authentication_attempt:
        description: restore-data only; exact Authentication backup attempt directory.
        required: false
        type: string
      lost_write_window:
        description: restore-data only; operator's acknowledged user-visible lost-write window.
        required: false
        type: string
      confirm:
        description: Type RESTORE or DELETE followed by one space and the replacement project ID.
        required: false
        type: string

run-name: "recovery ${{ inputs.operation }} ${{ inputs.replacement_project_id }} by @${{ github.actor }}"

permissions: {}

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  recover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production-recovery
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        if: inputs.operation != 'cleanup-project'
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js
        if: inputs.operation != 'cleanup-project'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install reviewed recovery tooling
        if: inputs.operation != 'cleanup-project'
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize the protected foundation inputs
        id: foundation
        shell: bash
        env:
          FOUNDATION_CONFIG: ${{ secrets.FOUNDATION_TFVARS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          config="${RUNNER_TEMP}/foundation-config.json"
          printf '%s' "${FOUNDATION_CONFIG}" >"${config}"
          jq --exit-status 'type == "object"' "${config}" >/dev/null
          printf 'file=%s\n' "${config}" >>"${GITHUB_OUTPUT}"

      - name: Authenticate as the recovery boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_RECOVERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RECOVERY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Install OpenTofu
        if: inputs.operation != 'cleanup-project'
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Select the immutable production receipt
        if: inputs.operation != 'cleanup-project'
        id: receipt
        shell: bash
        env:
          RECEIPT_BUCKET: ${{ vars.GCP_RECEIPT_BUCKET }}
          TARGET_RECEIPT: ${{ inputs.target_receipt }}
        run: |
          set -euo pipefail
          umask 077
          file="${RUNNER_TEMP}/target-receipt.json"
          ./ops/receipt-custody.sh fetch \
            "${RECEIPT_BUCKET}" "${file}" "${TARGET_RECEIPT}"
          printf 'file=%s\n' "${file}" >>"${GITHUB_OUTPUT}"

      - name: Compile the disposable workload inputs
        if: inputs.operation != 'cleanup-project'
        id: recovery
        shell: bash
        env:
          FOUNDATION_CONFIG_FILE: ${{ steps.foundation.outputs.file }}
          RECEIPT_FILE: ${{ steps.receipt.outputs.file }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
        run: |
          set -euo pipefail
          umask 077
          output="${RUNNER_TEMP}/recovery"
          ./ops/compile-recovery.mjs \
            "${FOUNDATION_CONFIG_FILE}" "${RECEIPT_FILE}" - "${REPLACEMENT_PROJECT_ID}" \
            placeholder placeholder foundation "${output}"
          printf 'directory=%s\n' "${output}" >>"${GITHUB_OUTPUT}"
          printf 'config=%s\n' "${FOUNDATION_CONFIG_FILE}" >>"${GITHUB_OUTPUT}"

      - name: Delete only the committed disposable recovery target
        if: inputs.operation == 'cleanup-project'
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          FOUNDATION_CONFIG_FILE: ${{ steps.foundation.outputs.file }}
          GH_TOKEN: ${{ github.token }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          TARGET_RECEIPT: ${{ inputs.target_receipt }}
        run: |
          set -euo pipefail
          ./ops/delete-recovery-project.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${REPLACEMENT_PROJECT_ID}" "${TARGET_RECEIPT}" \
            "${FOUNDATION_CONFIG_FILE}" \
            deploy/production/recovery-cleanup.json "${CONFIRM}"

      - name: Create the exact private recovery-foundation plan
        if: inputs.operation == 'plan-workload'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          plan_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./ops/create-reviewed-plan.sh foundation "${STATE_BUCKET}" \
            "${GITHUB_SHA}" "${plan_id}" \
            "${RECOVERY_DIRECTORY}/foundation.tfvars.json"
          printf 'Plan ID: %s\n' "${plan_id}"

      - name: Apply the exact recovery-foundation plan
        if: inputs.operation == 'apply-workload'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ inputs.plan_id }}
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if ! [[ "${PLAN_ID}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            printf 'Apply requires the exact recovery plan ID.\n' >&2
            exit 64
          fi
          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          ./ops/apply-reviewed-plan.sh foundation "${STATE_BUCKET}" \
            "${GITHUB_SHA}" "${PLAN_ID}" \
            "${RECOVERY_DIRECTORY}/foundation.tfvars.json"

      - name: Confirm and inspect exact data recovery points
        if: inputs.operation == 'restore-data'
        id: recovery_evidence
        shell: bash
        env:
          AUTHENTICATION_ATTEMPT: ${{ inputs.authentication_attempt }}
          BACKUP_BUCKET: ${{ vars.GCP_BACKUP_BUCKET }}
          CONFIRM: ${{ inputs.confirm }}
          JSON_KEYS_ATTEMPT: ${{ inputs.json_keys_attempt }}
          LOST_WRITE_WINDOW: ${{ inputs.lost_write_window }}
          RECEIPT_FILE: ${{ steps.receipt.outputs.file }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${CONFIRM}" != "RESTORE ${REPLACEMENT_PROJECT_ID}" ] || \
            [ -z "${LOST_WRITE_WINDOW}" ] || [ "${#LOST_WRITE_WINDOW}" -gt 500 ]; then
            printf 'Restore requires exact typed confirmation and a bounded lost-write acknowledgement.\n' >&2
            exit 64
          fi
          started_epoch="$(date -u +%s)"
          evidence="${RUNNER_TEMP}/recovery-points.json"
          ./ops/verify-recovery-points.sh "${BACKUP_BUCKET}" "${RECEIPT_FILE}" \
            "${JSON_KEYS_ATTEMPT}" "${AUTHENTICATION_ATTEMPT}" "${evidence}"
          printf 'file=%s\n' "${evidence}" >>"${GITHUB_OUTPUT}"
          printf 'started_epoch=%s\n' "${started_epoch}" >>"${GITHUB_OUTPUT}"

      - name: Compile exact recovery release inputs
        if: inputs.operation == 'restore-data'
        shell: bash
        env:
          AUTHENTICATION_ATTEMPT: ${{ inputs.authentication_attempt }}
          FOUNDATION_CONFIG_FILE: ${{ steps.recovery.outputs.config }}
          JSON_KEYS_ATTEMPT: ${{ inputs.json_keys_attempt }}
          RECEIPT_FILE: ${{ steps.receipt.outputs.file }}
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          outputs="${RECOVERY_DIRECTORY}/foundation-outputs.json"
          ./ops/tofu-gate.sh output foundation "${STATE_BUCKET}" "${outputs}"
          ./ops/compile-recovery.mjs \
            "${FOUNDATION_CONFIG_FILE}" "${RECEIPT_FILE}" "${outputs}" \
            "${REPLACEMENT_PROJECT_ID}" "${JSON_KEYS_ATTEMPT}" \
            "${AUTHENTICATION_ATTEMPT}" release "${RECOVERY_DIRECTORY}"

      - name: Promote receipt-owned recovery images
        if: inputs.operation == 'restore-data'
        shell: bash
        env:
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
        run: |
          set -euo pipefail
          ./ops/preflight-release.sh "${RECOVERY_DIRECTORY}/preflight.json"
          region="$(jq --raw-output '.region' "${RECOVERY_DIRECTORY}/active.tfvars.json")"
          gcloud auth configure-docker "${region}-docker.pkg.dev" --quiet >/dev/null 2>&1
          ./ops/promote-recovery-images.sh "${RECOVERY_DIRECTORY}/images.json"

      - name: Create recovery jobs without exposing services
        if: inputs.operation == 'restore-data'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          plan_id="${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT * 10 + 1))"
          ./ops/create-reviewed-plan.sh release "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${RECOVERY_DIRECTORY}/staging.tfvars.json"
          ./ops/apply-reviewed-plan.sh release "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${RECOVERY_DIRECTORY}/staging.tfvars.json"

      - name: Start the replacement databases and restore exact backups
        if: inputs.operation == 'restore-data'
        shell: bash
        env:
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          zone="$(jq --raw-output '.database_zone' "${RECOVERY_DIRECTORY}/foundation.tfvars.json")"
          ./ops/restore-database-release.sh "${REPLACEMENT_PROJECT_ID}" "${zone}" \
            "${RECOVERY_DIRECTORY}/database.json"

          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          outputs="${RECOVERY_DIRECTORY}/release-outputs.json"
          ./ops/tofu-gate.sh output release "${STATE_BUCKET}" "${outputs}"
          region="$(jq --raw-output '.region.value' "${outputs}")"
          for key in json_keys authentication; do
            job="$(jq --raw-output --arg key "${key}" '.postgres_recovery.value.recovery_jobs[$key]' "${outputs}")"
            executions="${RECOVERY_DIRECTORY}/${key}-executions.json"
            gcloud run jobs executions list --job="${job}" \
              --project="${REPLACEMENT_PROJECT_ID}" --region="${region}" \
              --format=json >"${executions}" 2>/dev/null
            if jq --exit-status \
              'any(.[]; any(.status.conditions[]?; .type == "Completed" and .status == "True"))' \
              "${executions}" >/dev/null; then
              printf '%s exact recovery already completed; reusing its durable execution.\n' "${key}"
            else
              if ! gcloud run jobs execute "${job}" --project="${REPLACEMENT_PROJECT_ID}" \
                --region="${region}" --wait --quiet --format=none >/dev/null 2>&1; then
                printf '%s exact recovery failed.\n' "${key}" >&2
                exit 70
              fi
            fi
          done

      - name: Deploy the selected receipt after both restores
        if: inputs.operation == 'restore-data'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DIRECTORY: ${{ steps.recovery.outputs.directory }}
          RECEIPT_BUCKET: ${{ vars.GCP_RECEIPT_BUCKET }}
          REPLACEMENT_PROJECT_ID: ${{ inputs.replacement_project_id }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          TARGET_RECEIPT: ${{ inputs.target_receipt }}
          LOST_WRITE_WINDOW: ${{ inputs.lost_write_window }}
          RECOVERY_POINTS_FILE: ${{ steps.recovery_evidence.outputs.file }}
          RECOVERY_STARTED_EPOCH: ${{ steps.recovery_evidence.outputs.started_epoch }}
        run: |
          set -euo pipefail
          export TOFU_STATE_SUFFIX="recovery/${REPLACEMENT_PROJECT_ID}"
          plan_id="${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT * 10 + 2))"
          ./ops/create-reviewed-plan.sh release "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${RECOVERY_DIRECTORY}/active.tfvars.json"
          ./ops/apply-reviewed-plan.sh release "${STATE_BUCKET}" "${GITHUB_SHA}" \
            "${plan_id}" "${RECOVERY_DIRECTORY}/active.tfvars.json"

          receipt="${RECOVERY_DIRECTORY}/recovery-receipt.json"
          completed_epoch="$(date -u +%s)"
          duration_seconds="$((completed_epoch - RECOVERY_STARTED_EPOCH))"
          jq -n --arg project "${REPLACEMENT_PROJECT_ID}" \
            --arg source "${TARGET_RECEIPT}" --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg lost "${LOST_WRITE_WINDOW}" \
            --argjson started_epoch "${RECOVERY_STARTED_EPOCH}" \
            --argjson completed_epoch "${completed_epoch}" \
            --argjson duration_seconds "${duration_seconds}" \
            --slurpfile points "${RECOVERY_POINTS_FILE}" '
              {
                schemaVersion: 2,
                replacementProject: $project,
                sourceReceipt: $source,
                commit: $commit,
                runId: $run_id,
                lostWriteWindow: $lost,
                recoveryPoints: $points[0],
                restoreDeployment: {
                  startedAt: ($started_epoch | strftime("%Y-%m-%dT%H:%M:%SZ")),
                  completedAt: ($completed_epoch | strftime("%Y-%m-%dT%H:%M:%SZ")),
                  durationSeconds: $duration_seconds
                }
              }
            ' \
            >"${receipt}"
          chmod 600 "${receipt}"
          if ! gcloud storage cp "${receipt}" \
            "gs://${RECEIPT_BUCKET}/recovery/${REPLACEMENT_PROJECT_ID}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --if-generation-match=0 --quiet >/dev/null 2>&1; then
            printf 'The immutable recovery receipt could not be created.\n' >&2
            exit 70
          fi
          printf 'Disposable recovery completed and its private receipt is durable.\n'
