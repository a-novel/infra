name: recovery

# Prepares or removes the host of one disaster-recovery drill in a disposable
# project. The drill itself follows docs/runbooks/disaster-recovery.md.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, apply or destroy the drill host.
        required: true
        type: choice
        options: [plan, apply, destroy]
      drill:
        description: JSON value of the recovery root's `recovery` variable.
        required: true
        type: string

run-name: "recovery ${{ inputs.operation }} by @${{ github.actor }}"

permissions: {}

concurrency:
  group: recovery
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  drill:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_SERVICE_ACCOUNT }}

      - name: Run the drill host operation
        shell: bash
        env:
          DRILL: ${{ inputs.drill }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          vars="$RUNNER_TEMP/drill.tfvars.json"
          jq -n --argjson recovery "$DRILL" '{recovery: $recovery}' >"$vars"
          tofu -chdir=environments/recovery init -input=false -lockfile=readonly -no-color -var-file="$vars"
          case "$OPERATION" in
            plan) tofu -chdir=environments/recovery plan -input=false -no-color -var-file="$vars" ;;
            apply) tofu -chdir=environments/recovery apply -input=false -no-color -auto-approve -var-file="$vars" ;;
            destroy) tofu -chdir=environments/recovery destroy -input=false -no-color -auto-approve -var-file="$vars" ;;
          esac
