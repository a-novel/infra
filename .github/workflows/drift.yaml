name: drift

on:
  schedule:
    - cron: "17 5 * * *"
    # Eight checks a day bound the instance time a health request keeps
    # Authentication billed; see docs/architecture.md.
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}

jobs:
  drift:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap
          - environments/production/foundation
          - environments/production/json-keys
          - environments/production/authentication
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tofu
        uses: $/.github/actions/tofu
        with:
          root: ${{ matrix.root }}
          allow_deletion: "true"
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      - if: steps.tofu.outputs.changes == 'true'
        shell: bash
        env:
          ROOT: ${{ matrix.root }}
        run: |
          echo "::error::$ROOT differs from master; see the job summary for the plan."
          exit 1

  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 */3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # A window is only ever cleared by hand; a forgotten one keeps services refusing work.
      - name: Fail when a planned downtime outlived its end
        if: env.DOWNTIME != ''
        shell: bash
        run: |
          set -euo pipefail
          end="$(jq -r .end <<<"$DOWNTIME")"
          if [ "$(date -d "$end" +%s)" -lt "$(date +%s)" ]; then
            echo "::error::The planned downtime ended at $end but is still set. Clear it with downtime.yaml."
            exit 1
          fi
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: $/.github/actions/health
