name: drift

# GitHub starts scheduled workflows hours late, so the dispatch clock starts the daily drift check on
# time (bootstrap/github-dispatch.tf). A dispatch also runs the health check.
on:
  schedule:
    # Every three hours: Authentication's health, and a reminder to clear a planned
    # downtime past its announced end.
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  # Every root on disk, so a new service root is drift-checked with no edit here.
  roots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: roots
        shell: bash
        run: |
          set -euo pipefail
          echo "roots=$(find environments/production -mindepth 1 -maxdepth 1 -type d | sort | jq -Rnc '["bootstrap"] + [inputs]')" >>"$GITHUB_OUTPUT"

  drift:
    needs: roots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.roots.outputs.roots) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub shows bypass lists, merge settings and security settings only to an App that can
      # change them, so the GitHub root plans with its Deploy App, through an identity only this
      # workflow on master mints. It never applies.
      - id: tofu
        uses: $/.github/actions/tofu
        with:
          root: ${{ matrix.root }}
          allow_deletion: "true"
          writer: ${{ matrix.root == 'environments/production/github' }}
          workload_identity_provider: ${{ matrix.root == 'environments/production/github' && vars.GCP_DRIFT_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ matrix.root == 'environments/production/github' && vars.GCP_DRIFT_SERVICE_ACCOUNT || vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      # The warning reaches the daily CI warnings digest on Discord.
      - if: steps.tofu.outputs.changes == 'true'
        shell: bash
        env:
          ROOT: ${{ matrix.root }}
        run: |
          echo "::warning::$ROOT differs from master; see the drift run's job summary for the plan."
          echo "::error::$ROOT differs from master; see the job summary for the plan."
          exit 1

  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 */3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only clearing a downtime ends it, so a forgotten one keeps services refusing work.
      - name: Fail when a planned downtime outlived its announced end
        if: env.DOWNTIME != ''
        shell: bash
        run: |
          set -euo pipefail
          end="$(jq -r .end <<<"$DOWNTIME")"
          if [ "$(date -d "$end" +%s)" -lt "$(date +%s)" ]; then
            echo "::error::The planned downtime was announced to end at $end, and its services still refuse work. Clear it with downtime.yaml once the work is done, or schedule it again with a later end."
            exit 1
          fi
      # Authentication admits only IAM callers; the token names its custom audience. Pull requests
      # can mint the plan identity, so this check runs as one that only drift.yaml on master gets.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_HEALTH_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_HEALTH_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: agora-authentication-rest
      - uses: $/.github/actions/health
        with:
          id_token: ${{ steps.google.outputs.id_token }}
