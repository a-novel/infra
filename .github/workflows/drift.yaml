name: drift

on:
  schedule:
    - cron: "17 5 * * *"
    # Every three hours: Authentication's health, and a reminder to clear a planned
    # downtime past its announced end.
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  # The planned downtime window, written only by downtime.yaml.
  DOWNTIME: ${{ vars.DOWNTIME }}
  # The release App's login, the author every deployed release image's Release must have.
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

jobs:
  drift:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap
          - environments/production/foundation
          - environments/production/json-keys
          - environments/production/authentication
          - environments/production/genai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tofu
        uses: $/.github/actions/tofu
        with:
          root: ${{ matrix.root }}
          allow_deletion: "true"
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      - if: steps.tofu.outputs.changes == 'true'
        shell: bash
        env:
          ROOT: ${{ matrix.root }}
        run: |
          echo "::error::$ROOT differs from master; see the job summary for the plan."
          exit 1

  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 */3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only clearing a downtime ends it, so a forgotten one keeps services refusing work.
      - name: Fail when a planned downtime outlived its announced end
        if: env.DOWNTIME != ''
        shell: bash
        run: |
          set -euo pipefail
          end="$(jq -r .end <<<"$DOWNTIME")"
          if [ "$(date -d "$end" +%s)" -lt "$(date +%s)" ]; then
            echo "::error::The planned downtime was announced to end at $end, and its services still refuse work. Clear it with downtime.yaml once the work is done, or schedule it again with a later end."
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: $/.github/actions/health
