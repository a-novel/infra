name: production drift

on:
  schedule:
    - cron: "17 5 * * *"
    # Eight checks/day bound instance-based idle time while still detecting a
    # launch outage without another monitoring service or credential.
    - cron: "43 */3 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect drift, assess an exact pull request, or observe a native rollout.
        required: true
        default: drift
        type: choice
        options:
          [drift, assess-pull-request, assess-image-update, observe-rollout]
      service:
        description: Observation only; select the JSON Keys pilot.
        required: false
        default: none
        type: choice
        options: [none, json-keys]
      release_id:
        description: Observation only; exact native Cloud Deploy release ID.
        required: false
        type: string
      rollout_id:
        description: Observation only; exact native rollout ID within that release.
        required: false
        type: string
      pull_request:
        description: Assessment only; pull request number.
        required: false
        type: string
      head_sha:
        description: Assessment only; exact candidate commit.
        required: false
        type: string
      base_sha:
        description: Assessment only; exact protected base commit.
        required: false
        type: string

run-name: >-
  ${{ inputs.operation == 'observe-rollout' &&
  format('observe rollout {0}/{1}/{2} by @{3}', inputs.service, inputs.release_id, inputs.rollout_id, github.actor) ||
  (inputs.operation == 'assess-pull-request' || inputs.operation == 'assess-image-update') &&
  format('resource-deletion assessment PR #{0} {1} onto {2}', inputs.pull_request, inputs.head_sha, inputs.base_sha) ||
  'production drift' }}

permissions: {}

concurrency:
  # Readers must not queue behind the deployment they need to inspect.
  group: ${{ inputs.operation == 'observe-rollout' && 'rollout-observation' || 'production-infrastructure' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  observe-rollout:
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'observe-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Authorize the exact observation scope
        id: scope
        shell: bash
        env:
          SERVICE_ROLLOUT_OBSERVATION_ENABLED: ${{ vars.SERVICE_ROLLOUT_OBSERVATION_ENABLED }}
          GCP_JSON_KEYS_ROLLOUT_PARENT: ${{ vars.GCP_JSON_KEYS_ROLLOUT_PARENT }}
          SELECTED_SERVICE: ${{ inputs.service }}
          RELEASE_ID: ${{ inputs.release_id }}
          ROLLOUT_ID: ${{ inputs.rollout_id }}
        run: |
          set -euo pipefail
          infra observation-inputs "${SELECTED_SERVICE}" "${RELEASE_ID}" "${ROLLOUT_ID}" >>"${GITHUB_OUTPUT}"

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Observe deployment and verification
        uses: $/.github/actions/observe-rollout
        with:
          rollout: ${{ steps.scope.outputs.rollout }}
          timeout: 10m

  inspect:
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'drift') ||
      github.event.schedule == '17 5 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      # The plan identity cannot create lock objects. Global workflow
      # concurrency serializes this read with all protected writers instead.
      - name: Compare every initialized root with its current private inputs
        shell: bash
        env:
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: infra inspect drift "${STATE_BUCKET}"

  health:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.PRODUCTION_RELEASES_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'drift') ||
      github.event.schedule == '43 */3 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Check Authentication and its dependencies
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          config="${RUNNER_TEMP}/foundation-health.tfvars.json"
          infra custody config fetch "${STATE_BUCKET}" foundation "${config}"
          infra check-health deployed "${config}"

  assess-resource-deletion:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'assess-pull-request' || inputs.operation == 'assess-image-update')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out trusted assessment tooling
        uses: actions/checkout@v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - name: Build reviewed infra tooling
        uses: $/.github/actions/setup-infra
        with:
          working_directory: trusted

      - name: Authorize the exact image-only update
        if: inputs.operation == 'assess-image-update'
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          infra assess-images verify

      # This check runs before credentials exist because the candidate plan can
      # execute providers and external data sources.
      - name: Resolve maintainer-approved exact candidate
        if: inputs.operation == 'assess-pull-request'
        id: target
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          repository="$(./trusted/ops/resolve-resource-deletion-assessment.sh \
            "${GITHUB_REPOSITORY}" "${PULL_REQUEST}" "${HEAD_SHA}" "${BASE_SHA}")"
          printf 'repository=%s\n' "${repository}" >>"${GITHUB_OUTPUT}"

      - name: Check out the exact candidate without running it
        if: inputs.operation == 'assess-pull-request'
        uses: actions/checkout@v7.0.1
        with:
          path: candidate
          persist-credentials: false
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ inputs.head_sha }}

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Install OpenTofu
        if: inputs.operation == 'assess-pull-request'
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: trusted/.opentofu-version
          tofu_wrapper: false
          cache: true

      - name: Assess plans with current private inputs
        shell: bash
        working-directory: trusted
        env:
          ASSESSMENT_OPERATION: ${{ inputs.operation }}
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MANAGEMENT_PROJECT_ID: ${{ vars.GCP_MANAGEMENT_PROJECT_ID }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          candidate="${GITHUB_WORKSPACE}/candidate"
          if [ "${ASSESSMENT_OPERATION}" = assess-image-update ]; then
            candidate=--image-only
          fi
          infra inspect assess \
            "${GITHUB_REPOSITORY}" "${PULL_REQUEST}" "${HEAD_SHA}" "${BASE_SHA}" \
            "${candidate}" "${STATE_BUCKET}" \
            "${RUNNER_TEMP}/resource-deletion/assessment.json"

      # The artifact deliberately contains only the exact commit tuple and
      # boolean verdict. Plans, state, and configuration stay on the runner.
      - name: Publish the payload-free verdict
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resource-deletion-assessment-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-deletion/assessment.json
          if-no-files-found: error
          retention-days: 7
