name: production drift

on:
  schedule:
    - cron: "17 5 * * *"
    # Eight checks/day bound instance-based idle time while still detecting a
    # launch outage without another monitoring service or credential.
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  inspect:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 5 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          cache: true

      # The plan identity cannot create lock objects. Global workflow
      # concurrency serializes this read with all protected writers instead.
      - name: Compare every initialized root with its current private inputs
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          for root in bootstrap foundation release; do
            file="${RUNNER_TEMP}/${root}.tfvars.json"
            set +e
            ./ops/config-custody.sh fetch "${STATE_BUCKET}" "${root}" "${file}"
            code=$?
            set -e
            if [ "${code}" -eq 4 ]; then
              printf '%s has not been initialized; drift check skipped.\n' "${root}"
              continue
            elif [ "${code}" -ne 0 ]; then
              exit "${code}"
            fi
            TOFU_VAR_FILE="${file}" \
              ./ops/tofu-gate.sh drift "${root}" "${STATE_BUCKET}"
          done

  health:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.PRODUCTION_RELEASES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '43 */3 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact master commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate as the read-only plan boundary
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: "581.0.0"

      - name: Check Authentication and its dependencies
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          config="${RUNNER_TEMP}/foundation-health.tfvars.json"
          ./ops/config-custody.sh fetch "${STATE_BUCKET}" foundation "${config}"
          ./ops/check-authentication-health.sh "${config}"
