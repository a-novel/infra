name: pin release

# A service or platform release dispatches `release` once every image it publishes is in the
# registry, so no pull request pins half a release. This pins them in one pull request per
# repository, opened by the Dependencies App so auto-approve-dependabot.yaml approves and queues it
# like a Renovate update. A blank line separates each service's pins in shared files, so releases of
# different services merge side by side. When a merge still leaves one conflicting, the next push to
# master rebuilds it from master, as Renovate rebases its own.
on:
  repository_dispatch:
    types: [release]
  push:
    branches: [master]

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-24.04
    # The privileged keys are secrets of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike the workflow token's, the App's commits and pull requests start CI.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Pin the release, or rebuild conflicting release pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ steps.token.outputs.app-slug }}
          EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ github.event.client_payload.repository }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: node .github/scripts/pin-release.mjs
