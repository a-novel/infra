name: pin release

# A service or platform release dispatches `release` once every image it publishes is in the
# registry, so no pull request pins half a release. This pins them in one pull request per
# repository, opened by the Dependencies App so auto-approve-dependabot.yaml approves and queues it
# like a Renovate update. Release pull requests edit neighbouring lines, so a merge can leave another
# one conflicting: each push to master rebuilds those from master, as Renovate rebases its own.
on:
  repository_dispatch:
    types: [release]
  push:
    branches: [master]

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-24.04
    # The privileged keys are secrets of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike the workflow token's, the App's commits and pull requests start CI.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Pin the release, or rebuild conflicting release pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ steps.token.outputs.app-slug }}
          EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ github.event.client_payload.repository }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          paths=(':(glob)environments/production/*/terraform.tfvars' ':(glob)builds/*.Dockerfile')
          semver='v[0-9]+\.[0-9]+\.[0-9]+'

          newest() { printf '%s\n' "$@" | sort -V | tail -n1; }

          # The release a pull request pins, read from its head commit, which moves with the branch.
          branch_version() {
            { gh api "repos/$GH_REPO/commits/heads/$1" --jq .commit.message 2>/dev/null || true; } |
              sed -nE "1s/^chore\(deps\): update [a-z0-9-]+ images to ($semver)\$/\1/p"
          }

          # Pins every image of a release, rebuilt from master. A late dispatch never moves a pull
          # request back: it keeps the newest release seen, and master's pins are the floor.
          pin() {
            local source="$1" branch="chore/deps/${1#*/}" version current pr image digest tree commit url
            if ! [[ $source =~ ^$GITHUB_REPOSITORY_OWNER/[a-z0-9-]+$ ]]; then
              echo "::error::Cannot pin \"$source\": not a repository of $GITHUB_REPOSITORY_OWNER."
              return 1
            fi
            version="$(newest "$2" "$(branch_version "$branch")")"
            if ! [[ $version =~ ^$semver$ ]]; then
              echo "::error::Cannot pin $source at \"$version\": not a release tag."
              return 1
            fi
            git reset -q --hard
            current="$({ git grep -h -o -E "ghcr\.io/$source(/[a-z0-9._/-]+)?:$semver" -- "${paths[@]}" || true; } |
              sed 's/.*://' | sort -V | tail -n1)"
            if [ -z "$current" ]; then
              echo "::notice::Infra pins no image of $source."
              return
            fi
            pr="$(gh pr list --head "$branch" --app "$APP" --json number --jq '.[0].number // empty')"
            if [ "$(newest "$version" "$current")" = "$current" ]; then
              echo "::notice::master already pins $source $current."
              [ -z "$pr" ] || gh pr close "$pr" --delete-branch --comment "master already pins $source $current."
              return
            fi

            for image in $(git grep -h -o -E "ghcr\.io/$source(/[a-z0-9._/-]+)?:$semver" -- "${paths[@]}" | sed 's/:[^:]*$//' | sort -u); do
              digest="sha256:$(skopeo inspect --raw "docker://$image:$version" | sha256sum | cut -d' ' -f1)"
              # A digest-pinned reference takes the new digest; a tag-only one, such as a FROM line, stays so.
              git ls-files -z -- "${paths[@]}" | xargs -0 sed -i -E \
                -e "s#${image//./\\.}:$semver@sha256:[a-f0-9]{64}#$image:$version@$digest#g" \
                -e "s#${image//./\\.}:$semver([^@0-9.]|\$)#$image:$version\1#g"
            done

            # master requires signed commits, and GitHub signs only those an App makes through its API.
            local title="chore(deps): update ${source#*/} images to $version"
            tree="$(git diff --name-only | while read -r path; do
              jq -n --arg path "$path" --rawfile content "$path" '{path: $path, mode: "100644", type: "blob", content: $content}'
            done | jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base, tree: .}' |
              gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)"
            commit="$(gh api "repos/$GH_REPO/git/commits" -f message="$title" -f tree="$tree" \
              -f "parents[]=$(git rev-parse HEAD)" --jq .sha)"
            if [ "$(newest "$version" "$(branch_version "$branch")")" != "$version" ]; then
              echo "::notice::A concurrent run pinned a newer $source release."
              return
            fi
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$commit" -F force=true --silent 2>/dev/null ||
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" --silent

            local body="Deploys [$source $version]($GITHUB_SERVER_URL/$source/releases/tag/$version), whose release published every image pinned here."
            if [ -n "$pr" ]; then
              url="$(gh pr edit "$pr" --title "$title" --body "$body")"
            else
              url="$(gh pr create --head "$branch" --title "$title" --body "$body" --label dependencies)"
            fi
            echo "Pinned $source $version: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT" = repository_dispatch ]; then
            pin "$RELEASE_REPOSITORY" "$RELEASE_VERSION"
            exit 0
          fi
          # GitHub computes mergeability lazily after a push, so UNKNOWN means "ask again".
          for attempt in 1 2 3 4 5 6; do
            prs="$(gh pr list --app "$APP" --json headRefName,title,mergeable --jq '[.[] |
              select((.headRefName | startswith("chore/deps/")) and (.title | test("^chore\\(deps\\): update [a-z0-9-]+ images to v")))]')"
            jq -e 'any(.[]; .mergeable == "UNKNOWN")' <<<"$prs" >/dev/null || break
            [ "$attempt" = 6 ] || sleep 15
          done
          for branch in $(jq -r '.[] | select(.mergeable == "CONFLICTING") | .headRefName' <<<"$prs"); do
            pin "$GITHUB_REPOSITORY_OWNER/${branch#chore/deps/}" ""
          done
