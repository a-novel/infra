name: sweep

# Applies the GitHub root when a repository's workflows or root package.json changed on its default
# branch since the last successful sweep, so repository config follows the code with no pull request
# here (a-novel/.github#534). GitHub starts scheduled workflows hours late, so the dispatch clock
# starts this one every 10 minutes (bootstrap/github-dispatch.tf).
on:
  workflow_dispatch:

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  # The tofu action reads both, though the GitHub root deploys no image.
  DOWNTIME: ${{ vars.DOWNTIME }}
  RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

# The deploy's github job shares the group, so the two never apply the root at once.
concurrency:
  group: github-root
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A failed sweep leaves the window open from the last one that succeeded. The first sweep
          # applies.
          since="$(gh run list --repo "$REPOSITORY" --workflow sweep.yaml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          changed=false
          [ -n "$since" ] || changed=true
          if [ "$changed" = false ]; then
            for owner in a-novel a-novel-kit; do
              while read -r repository; do
                for path in .github/workflows package.json; do
                  if [ -n "$(gh api "repos/$repository/commits?sha=master&path=$path&since=$since&per_page=1" --jq '.[0].sha // empty')" ]; then
                    echo "$repository: $path changed since $since."
                    changed=true
                  fi
                done
              done < <(gh api --paginate "orgs/$owner/repos?per_page=100" --jq '.[] | select(.archived | not) | .full_name')
            done
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

  apply:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sweep never deletes: a deletion waits for a pull request with allow-resource-deletion, so
      # a repository that loses its CI files keeps its config.
      - uses: $/.github/actions/tofu
        with:
          root: environments/production/github
          apply: "true"
          allow_deletion: "false"
          workload_identity_provider: ${{ vars.GCP_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}
          github_token: ${{ github.token }}
      # Until a pull request fixes it, each sweep fails again; the warning reaches the daily CI
      # warnings digest on Discord.
      - if: failure()
        shell: bash
        run: echo "::warning::The sweep could not apply the GitHub root; see this run's log."
