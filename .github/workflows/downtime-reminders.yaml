name: downtime reminders

# Reminds the public planned downtime channel 1 week, 1 day, 6 hours and 30 minutes before a planned
# downtime starts, then announces the start. Scheduled runs come late or not at all under load, so
# each run posts what fell due since the previous successful run, and only the most urgent of those.
on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: downtime-reminders
  cancel-in-progress: false

jobs:
  remind:
    if: vars.DOWNTIME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Find the reminder that fell due
        id: due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DOWNTIME: ${{ vars.DOWNTIME }}
        run: |
          set -euo pipefail
          # Nothing older than the downtime itself: downtime.yaml rewrites the downtime branch on
          # every change, so a rescheduled downtime is reminded again.
          since="$(date -d "$(gh api "repos/$REPOSITORY/commits/downtime" --jq .commit.committer.date)" +%s)"
          last="$(gh run list --repo "$REPOSITORY" --workflow downtime-reminders.yaml --status success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          if [ -n "$last" ] && [ "$(date -d "$last" +%s)" -gt "$since" ]; then since="$(date -d "$last" +%s)"; fi
          now="$(date +%s)"
          start="$(date -d "$(jq -r .start <<<"$DOWNTIME")" +%s)"
          # Most urgent first, so the first reminder that fell due is the one posted.
          for reminder in "0 started" "1800 in 30 minutes" "21600 in 6 hours" "86400 in 1 day" "604800 in 1 week"; do
            at=$((start - ${reminder%% *}))
            if [ "$at" -gt "$since" ] && [ "$at" -le "$now" ]; then
              title="⏰ Planned downtime ${reminder#* }" color=upcoming
              [ "${reminder%% *}" = 0 ] && title="🚧 Planned downtime started" color=in-progress
              { echo "title=$title"; echo "color=$color"; } >>"$GITHUB_OUTPUT"
              break
            fi
          done

      - if: steps.due.outputs.title != ''
        uses: $/.github/actions/announce-downtime
        with:
          webhook: ${{ secrets.DOWNTIME_WEBHOOK }}
          window: ${{ vars.DOWNTIME }}
          title: ${{ steps.due.outputs.title }}
          color: ${{ steps.due.outputs.color }}
